name: Update Calendar Data

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual runs

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes
      actions: write # Required to trigger workflows
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download Calendar from Zoho
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 5 \
            "$ZOHO_ICAL_URL" \
            --output events.ics
        env:
          ZOHO_ICAL_URL: ${{ secrets.ZOHO_ICAL_URL }}

      - name: Commit and Push changes
        run: |
          set -euo pipefail
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          # Commit only if the target file changed
          if ! git diff --quiet -- events.ics; then
            git add events.ics
            git commit -m "chore: auto-update calendar"
            git push
            echo "CALENDAR_UPDATED=true" >> $GITHUB_ENV
          else
            echo "No calendar changes detected."
          fi

      - name: Trigger deployment
        if: env.CALENDAR_UPDATED == 'true'
        run: |
          gh workflow run static.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
