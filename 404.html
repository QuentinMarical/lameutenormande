<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page introuvable - La Meute Normande</title>
  <meta name="description" content="Cette page n'existe pas ou plus sur le site de La Meute Normande.">
  <link rel="shortcut icon" href="assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <style>
    :root {
      --bg-1: #1e1430; --bg-2: #120d22; --bg-3: #0d0a1c;
      --violet: #a855f7; --violet-2: #c084fc;
      --text: rgba(255, 255, 255, 0.9); --muted: rgba(255, 255, 255, 0.62);
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem; text-align: center;
      background: radial-gradient(120vw 80vh at 50% -10%, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
      color: var(--text); font-family: 'Inter Tight', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap { max-width: 480px; }
    .logo { width: 140px; height: auto; margin-bottom: 1.75rem; }
    .code {
      font-size: 5rem; font-weight: 800; line-height: 1; margin: 0 0 .5rem;
      background: linear-gradient(135deg, var(--violet-2), var(--violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 .6rem; color: #fff; }
    p { color: var(--muted); font-size: .95rem; line-height: 1.6; margin: 0 0 1.75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; }
    a.btn {
      display: inline-flex; align-items: center; gap: .5rem; text-decoration: none;
      padding: .8rem 1.4rem; border-radius: 10px; font-weight: 600; font-size: .9rem;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.btn.primary { background: linear-gradient(135deg, var(--violet-2), var(--violet)); color: #fff; box-shadow: 0 8px 22px rgba(168, 85, 247, 0.35); }
    a.btn.secondary { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line); }
    a.btn:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/images/logo-2000x837.png" alt="La Meute Normande" decoding="async">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>Ce lien est cassé ou cette page n'existe plus. Tu peux repartir vers l'accueil ou consulter les prochains évènements.</p>
    <div class="actions">
      <a class="btn primary" href="/">Retour à l'accueil</a>
      <a class="btn secondary" href="/events.html">Évènements</a>
    </div>
  </div>
</body>
</html>
