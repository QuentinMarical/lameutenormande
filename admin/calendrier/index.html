<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration — Calendrier de la Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="stylesheet" href="../../elections/assets/elections.css">
  <link rel="stylesheet" href="../assets/admin.css">
</head>
<body>
  <!-- Pas de topbar/page-head statiques : l'en-tête (identité + statut de connexion) est construit
       dynamiquement une fois connecté, même module que sur le hub admin (voir admin/index.html). -->
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../elections/assets/config.js"></script>
  <script src="../../elections/assets/common.js"></script>
  <script src="../assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    // Même pied de page minimal que sur le hub admin (voir admin/index.html) plutôt que le module
    // complet de E.footer() (bandeau/titre/crédit, partagé avec les pages publiques) : liens
    // utilitaires + note en petits caractères.
    { const f = E.qs('#footer'); f.innerHTML = '<div class="legal-links">'
      + '<a href="tg://resolve?domain=NitraFox">Aide</a><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="mentions">Mentions légales</button><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="confidentialite">Confidentialité et cookies</button></div>'
      + '<p class="legal">Utilise la navigation privée si ce n\'est pas ton appareil.</p>';
      f.addEventListener('click', (e) => { const b = e.target.closest('.legal-btn'); if (b && E.openLegal) E.openLegal(b.dataset.legal); }); }
    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (même compte que les autres panels) ----------
    const LOGO = 'https://lameutenormande.fr/assets/images/logo-2000x837.png';
    const HUB_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">'
      + '<circle cx="5" cy="5" r="2.1" fill="currentColor"/><circle cx="12" cy="5" r="2.1" fill="currentColor"/><circle cx="19" cy="5" r="2.1" fill="currentColor"/>'
      + '<circle cx="5" cy="12" r="2.1" fill="currentColor"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/><circle cx="19" cy="12" r="2.1" fill="currentColor"/>'
      + '<circle cx="5" cy="19" r="2.1" fill="currentColor"/><circle cx="12" cy="19" r="2.1" fill="currentColor"/><circle cx="19" cy="19" r="2.1" fill="currentColor"/></svg>';
    const session = await E.adminSession();
    if (!session) {
      app.classList.add('login-mode');
      let emailVal = '';

      function renderLogin(step) {
        const card = h('div', { class: 'login-card' });

        if (step !== 'password') {
          const email = h('input', { class: 'input login-input', type: 'email', autocomplete: 'username', required: true, placeholder: 'Email', 'aria-label': 'E-mail', value: emailVal || null });
          const btn = h('button', { class: 'btn', type: 'submit' }, 'Suivant');
          const backToHub = h('button', { type: 'button', class: 'btn secondary login-secondary', onClick: () => history.back() }, 'Retour');
          const form = h('form', null,
            h('img', { class: 'login-logo', src: LOGO, alt: '' }),
            h('div', { class: 'login-title' }, 'Se connecter'),
            h('div', { class: 'field' }, email), btn, backToHub);
          form.addEventListener('submit', ev => {
            ev.preventDefault();
            const v = email.value.trim(); if (!v) return;
            emailVal = v; renderLogin('password');
          });
          card.appendChild(form);
          E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
          email.focus();
          return;
        }

        const back = h('button', { type: 'button', class: 'login-back', 'aria-label': 'Changer d\'e-mail', onClick: () => renderLogin('email') }, '←');
        const pass = h('input', { class: 'input login-input', type: 'password', autocomplete: 'current-password', required: true, placeholder: 'Mot de passe', 'aria-label': 'Mot de passe' });
        const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
        const form = h('form', null,
          h('img', { class: 'login-logo', src: LOGO, alt: '' }),
          h('div', { class: 'login-email-pill' }, emailVal),
          h('div', { class: 'login-title' }, 'Entre ton mot de passe'),
          h('div', { class: 'field' }, pass), btn);
        form.addEventListener('submit', async ev => {
          ev.preventDefault(); btn.disabled = true;
          const { error } = await E.sb.auth.signInWithPassword({ email: emailVal, password: pass.value });
          if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
          location.reload();
        });
        card.append(back, form);
        E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
        pass.focus();
      }
      renderLogin('email');
      return;
    }
    if (!(await E.isAdmin())) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    const dashHeader = h('div', { class: 'dash-header' },
      h('div', { class: 'dash-identity' },
        h('a', { class: 'hub-btn', href: 'https://lameutenormande.fr/admin/', title: 'Espace admin', 'aria-label': 'Espace admin', html: HUB_ICON }),
        h('span', { class: 'dash-sep' }),
        h('a', { class: 'dash-brand', href: 'https://lameutenormande.fr/', title: 'Retour au site' },
          h('img', { class: 'dash-logo', src: LOGO, alt: '' }),
          h('h1', { class: 'dash-title' }, 'Administration du calendrier'))),
      h('div', { class: 'dash-account' },
        h('span', { class: 'dash-email' }, session.user.email || 'admin'),
        h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, '⏻ ', 'Se déconnecter')));
    E.clear(app).appendChild(dashHeader);

    const tabs = [['ajouter', 'Ajouter'], ['reglages', 'Réglages']];
    const tabBar = h('div', { class: 'tabs' });
    const pane = h('div');
    app.append(tabBar, pane);
    let activeTab = location.hash.replace('#', '') || 'ajouter';
    tabs.forEach(([id, label]) => tabBar.appendChild(h('button', { type: 'button', dataset: { tab: id }, onClick: () => { activeTab = id; location.hash = id; show(id); } }, label)));
    function show(id) {
      E.qsa('.tabs button', tabBar).forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      E.clear(pane).appendChild(E.loader());
      ({ ajouter, reglages })[id]().catch(err => { E.clear(pane).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, E.errMsg(err)))); });
    }

    // ---------- Ajout d'un évènement au calendrier Zoho ----------
    // Cet onglet n'affiche aucune liste (le calendrier lui-même reste sur Zoho) : il se contente
    // d'y créer des évènements via la fonction zoho-create-event (voir
    // elections/supabase/functions/zoho-create-event/). Le site public continue de lire
    // events.ics à la racine, régénéré depuis Zoho par le robot GitHub Actions
    // (.github/workflows/update-calendar.yml, toutes les heures — ou immédiatement si la
    // fonction est configurée pour le déclencher, voir son en-tête).
    async function ajouter() {
    E.clear(pane);
    pane.appendChild(h('div', { class: 'card info column', style: { marginBottom: '18px' } },
      h('div', { class: 'title', style: { fontSize: '15px' } }, 'Comment ça marche'),
      h('div', { class: 'desc' }, 'Cet outil ajoute directement l\'évènement au calendrier Zoho. Le calendrier public du site (page Événements) se met à jour automatiquement dans l\'heure qui suit — pas besoin de repasser ailleurs.')));

    const titleInp = h('input', { class: 'input', placeholder: 'Ex. Japan Otaku Festival Evreux 2026', required: true });
    const furryChk = h('input', { type: 'checkbox' });
    const locationInp = h('input', { class: 'input', placeholder: 'Ex. Parc des expositions, Évreux, France' });
    const urlInp = h('input', { class: 'input', type: 'url', placeholder: 'https://…' });
    const descInp = h('textarea', { class: 'input', rows: '4', placeholder: 'Détails, programme, liens billetterie…' });
    const allDayChk = h('input', { type: 'checkbox' });
    const startInp = h('input', { class: 'input', type: 'datetime-local', required: true });
    const endInp = h('input', { class: 'input', type: 'datetime-local', required: true });
    const startLabel = h('label', null, 'Début');
    const endField = h('div', { class: 'field' }, h('label', null, 'Fin'), endInp);
    const datesRow = h('div', { class: 'grid-2' }, h('div', { class: 'field' }, startLabel, startInp), endField);

    // Journée entière : un seul champ "Date" (le champ Fin est masqué, sa valeur suit celle du
    // champ Date au moment de l'envoi — voir le handler submit) plutôt que Début/Fin identiques
    // à saisir deux fois pour un évènement d'un jour.
    function syncDateInputsType() {
      const allDay = allDayChk.checked;
      const type = allDay ? 'date' : 'datetime-local';
      [startInp, endInp].forEach(inp => {
        if (inp.type === type) return;
        const v = inp.value ? inp.value.slice(0, 10) : '';
        inp.type = type;
        inp.value = type === 'date' ? v : (v ? v + 'T00:00' : '');
      });
      startLabel.textContent = allDay ? 'Date' : 'Début';
      endField.hidden = allDay;
      endInp.required = !allDay;
      datesRow.classList.toggle('grid-2', !allDay);
    }
    allDayChk.addEventListener('change', syncDateInputsType);

    const submitBtn = h('button', { class: 'btn', type: 'submit' }, '＋ Ajouter au calendrier');
    const form = h('form', { class: 'card column' },
      h('div', { class: 'title', style: { fontSize: '16px' } }, 'Nouvel évènement'),
      h('div', { class: 'field' }, h('label', null, 'Titre'), titleInp),
      h('label', { class: 'check', style: { display: 'inline-flex', width: 'fit-content' } }, furryChk, 'Évènement furry 🦊'),
      h('div', { class: 'grid-2' },
        h('div', { class: 'field' }, h('label', null, 'Lieu'), locationInp),
        h('div', { class: 'field' }, h('label', null, 'Lien (billetterie, page de l\'évènement…)'), urlInp)),
      h('div', { class: 'field' }, h('label', null, 'Description'), descInp),
      h('label', { class: 'check', style: { display: 'inline-flex', width: 'fit-content' } }, allDayChk, 'Journée entière'),
      datesRow,
      h('div', { class: 'btn-row' }, submitBtn));
    pane.appendChild(form);

    const recentBox = h('div', { style: { marginTop: '18px' } });
    pane.appendChild(recentBox);
    const recentList = [];
    function paintRecent() {
      E.clear(recentBox);
      if (!recentList.length) return;
      recentBox.appendChild(h('div', { class: 'section-title' }, 'Ajoutés pendant cette session'));
      recentList.forEach(r => recentBox.appendChild(h('div', { class: 'cand' }, h('div', { class: 'body' },
        h('div', { class: 'name' }, r.title), h('div', { class: 'handles' }, h('span', null, r.when))))));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInp.value.trim();
      if (!title) { E.toast('Le titre est obligatoire.', 'error'); return; }
      const allDay = allDayChk.checked;
      if (!startInp.value || (!allDay && !endInp.value)) { E.toast(allDay ? 'La date est obligatoire.' : 'Les dates de début et de fin sont obligatoires.', 'error'); return; }
      // Journée entière : un seul champ saisi (le champ Fin, masqué, n'est pas fiable) — on
      // envoie la même date telle quelle (YYYY-MM-DD) pour le début et la fin, sans passer par
      // un objet Date/ISO qui ferait glisser le jour d'une unité pour tout fuseau en avance sur
      // UTC (ex. minuit heure de Paris en été = 22h UTC la veille).
      const start = allDay ? startInp.value : new Date(startInp.value).toISOString();
      const end = allDay ? startInp.value : new Date(endInp.value).toISOString();
      if (!allDay && new Date(end) < new Date(start)) { E.toast('La date de fin doit être après le début.', 'error'); return; }

      submitBtn.disabled = true; submitBtn.textContent = 'Ajout…';
      try {
        await E.invokeFn('zoho-create-event', {
          title, location: locationInp.value.trim(), url: urlInp.value.trim(),
          description: descInp.value.trim(), furry: furryChk.checked, allDay, start, end,
        });
        E.toast('Évènement ajouté au calendrier Zoho.', 'success');
        recentList.unshift({ title: furryChk.checked ? '🦊 ' + title : title, when: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) });
        paintRecent();
        form.reset();
        allDayChk.checked = false; syncDateInputsType();
      } catch (err) {
        E.toast(E.errMsg(err), 'error');
      } finally {
        submitBtn.disabled = false; submitBtn.textContent = '＋ Ajouter au calendrier';
      }
    });
    }

    // ---------- Réglages ----------
    // Uniquement des champs propres à Zoho (pas de notion générique de « fournisseur de
    // calendrier ») : l'UID du calendrier et le centre de données Zoho où vit le compte — un
    // menu fermé sur les centres de données réellement documentés par Zoho (pas un champ texte
    // libre, pour éviter qu'une faute de frappe dans un nom de domaine casse tout). Les vrais
    // secrets (ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN, GITHUB_TOKEN pour la synchro GitHub, hors
    // périmètre Zoho) restent des secrets Supabase (Dashboard/CLI), jamais stockés en base ni
    // affichés ici — voir elections/supabase/README.md, section 5. app_settings est la même
    // table clé/valeur que « Réglages » côté élections (RLS : accès réservé aux admins).
    const ZOHO_DATACENTERS = [
      { value: 'eu', label: 'Europe (.eu)', accounts: 'accounts.zoho.eu', api: 'calendar.zoho.eu' },
      { value: 'com', label: 'États-Unis (.com)', accounts: 'accounts.zoho.com', api: 'calendar.zoho.com' },
      { value: 'in', label: 'Inde (.in)', accounts: 'accounts.zoho.in', api: 'calendar.zoho.in' },
      { value: 'com.au', label: 'Australie (.com.au)', accounts: 'accounts.zoho.com.au', api: 'calendar.zoho.com.au' },
      { value: 'jp', label: 'Japon (.jp)', accounts: 'accounts.zoho.jp', api: 'calendar.zoho.jp' },
      { value: 'com.cn', label: 'Chine (.com.cn)', accounts: 'accounts.zoho.com.cn', api: 'calendar.zoho.com.cn' },
    ];
    async function reglages() {
      E.clear(pane);
      const { data } = await E.sb.from('app_settings').select('*');
      const map = Object.fromEntries((data || []).map(r => [r.key, r.value]));
      const currentDc = ZOHO_DATACENTERS.find(dc => dc.accounts === map.zoho_accounts_domain) || ZOHO_DATACENTERS[0];
      const calendarUid = h('input', { class: 'input', value: map.zoho_calendar_uid || '', placeholder: 'UID du calendrier (voir README, section 5.3)' });
      const dcSelect = h('select', { class: 'input' }, ...ZOHO_DATACENTERS.map(dc => h('option', { value: dc.value, selected: dc.value === currentDc.value }, dc.label)));
      const save = h('button', { class: 'btn', type: 'submit' }, 'Enregistrer');
      const form = h('form', { class: 'card column' },
        h('div', { class: 'title' }, 'Paramètres de l\'API Zoho'),
        h('div', { class: 'desc' }, 'Le Client ID, le Client Secret et le refresh token Zoho (ainsi que le token GitHub pour la synchro immédiate) restent des secrets réglés uniquement via le Dashboard Supabase (jamais ici) — voir '
          + 'elections/supabase/README.md, section 5.'),
        h('div', { class: 'field' }, h('label', null, 'UID du calendrier Zoho'), calendarUid),
        h('div', { class: 'field' }, h('label', null, 'Centre de données Zoho du compte'), dcSelect),
        h('div', { class: 'btn-row' }, save));
      form.addEventListener('submit', async ev => {
        ev.preventDefault(); save.disabled = true;
        const dc = ZOHO_DATACENTERS.find(d => d.value === dcSelect.value) || ZOHO_DATACENTERS[0];
        const rows = [
          { key: 'zoho_calendar_uid', value: calendarUid.value.trim() },
          { key: 'zoho_accounts_domain', value: dc.accounts },
          { key: 'zoho_api_domain', value: dc.api },
        ];
        const { error } = await E.sb.from('app_settings').upsert(rows, { onConflict: 'key' });
        save.disabled = false;
        if (error) { E.toast(E.errMsg(error), 'error'); return; }
        E.toast('Réglages enregistrés.', 'success');
      });
      pane.appendChild(form);
    }

    show(activeTab);
  })();
  </script>
</body>
</html>
