<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace admin — La Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="stylesheet" href="../elections/assets/elections.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="https://lameutenormande.fr/" title="Retour au site"><img src="https://lameutenormande.fr/assets/images/logo-2000x837.png" alt="La Meute Normande" decoding="async"></a>
      <div class="actions" id="topbarActions"></div>
    </div>
  </header>
  <section class="page-head">
    <h1>Espace admin</h1>
    <div class="sub">Les outils d'administration du staff, réunis au même endroit.</div>
  </section>
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../elections/assets/config.js"></script>
  <script src="../elections/assets/common.js"></script>
  <script src="assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');

    { const f = E.qs('#footer'); f.innerHTML = '<div class="footer-divider"></div>'
      + '<div class="footer-title">Espace admin de la Meute</div>'
      + '<div class="legal-links"><button type="button" class="legal-btn" data-legal="mentions">Mentions légales</button><span class="legal-sep">·</span><button type="button" class="legal-btn" data-legal="confidentialite">Politique de confidentialité</button><span class="legal-sep">·</span><button type="button" class="legal-btn" data-legal="cookies">Politique de cookies</button></div>'
      + '<p class="legal">Outil réalisé par <a href="tg://resolve?domain=NitraFox" class="link-nitra">Nitra🦊</a> pour <a href="https://lameutenormande.fr" class="link-violet">La Meute Normande</a>.</p>';
      f.addEventListener('click', (e) => { const b = e.target.closest('.legal-btn'); if (b && E.openLegal) E.openLegal(b.dataset.legal); }); }

    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (même compte Supabase Auth que les panels) ----------
    const session = await E.adminSession();
    if (!session) {
      const email = h('input', { class: 'input', type: 'email', autocomplete: 'username', required: true, placeholder: 'admin@exemple.fr' });
      const pass = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
      const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
      const form = h('form', { class: 'card info column', style: { maxWidth: '460px', margin: '0 auto' } },
        h('div', { class: 'title' }, 'Connexion administrateur'),
        h('div', { class: 'field' }, h('label', null, 'E-mail'), email), h('div', { class: 'field' }, h('label', null, 'Mot de passe'), pass),
        h('div', { class: 'btn-row', style: { marginTop: 0 } }, btn));
      form.addEventListener('submit', async ev => {
        ev.preventDefault(); btn.disabled = true;
        const { error } = await E.sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
        if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
        location.reload();
      });
      E.clear(app).appendChild(form);
      return;
    }
    const { data: isAdmin } = await E.sb.rpc('is_admin');
    if (!isAdmin) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    // Compte connecté, même pastille que sur les autres panels admin (voir admin/utilisateurs/).
    E.qs('#topbarActions').appendChild(h('span', { class: 'account' },
      h('span', null, session.user.email || 'admin'),
      h('button', { type: 'button', onClick: E.signOut, title: 'Se déconnecter' }, E.icon('right-from-bracket'))));

    // ---------- Outils disponibles ----------
    // links : onglets internes de l'outil (hash sur sa propre page) affichés en accès directs ;
    // omis pour un outil à page unique (Utilisateurs) ou un raccourci externe (Bureau Meute), qui
    // affichent un simple bouton « Ouvrir » à la place.
    const TOOLS = [
      {
        key: 'elections', label: 'Élections', icon: 'check-to-slot', accent: 'violet', href: 'elections/',
        desc: 'Scrutins, candidatures, dépouillement, votants et audit.',
        links: [
          { title: 'Scrutins', hash: 'scrutins' }, { title: 'Codes', hash: 'codes' },
          { title: 'Candidatures', hash: 'candidatures' }, { title: 'Votants', hash: 'votants' },
          { title: 'Audit', hash: 'audit' }, { title: 'Procès-verbal', hash: 'pv' }, { title: 'Réglages', hash: 'reglages' }
        ]
      },
      {
        key: 'votes', label: 'Sondages', icon: 'chart-simple', accent: 'orange', href: 'votes/',
        desc: 'Sondages ponctuels : présence, covoiturage, préférences…',
        links: [{ title: 'Sondages', hash: 'sondages' }, { title: 'Réponses', hash: 'reponses' }]
      },
      {
        key: 'utilisateurs', label: 'Utilisateurs', icon: 'gear', accent: 'ok', href: 'utilisateurs/',
        desc: 'Comptes administrateurs, communs à tous les panels ci-dessus.'
      },
      {
        key: 'bureau', label: 'Bureau Meute', icon: 'paper-plane', accent: 'telegram', href: 'https://web.telegram.org/k/#-2361870096', external: true,
        desc: 'Groupe Telegram du staff, pour échanger en dehors des outils.'
      }
    ];

    function toolCard(t) {
      const icon = h('div', { class: 'tool-icon acc-' + t.accent }, E.icon(t.icon));
      const head = h('div', { class: 'tool-head' }, icon,
        h('div', null, h('div', { class: 'tool-title' }, t.label), h('div', { class: 'tool-desc' }, t.desc)));
      if (t.links) {
        return h('div', { class: 'tool-card' }, head,
          h('div', { class: 'tool-links' }, t.links.map(l => h('a', { class: 'tool-pill', href: t.href + '#' + l.hash }, l.title))));
      }
      return h('div', { class: 'tool-card single' }, head,
        h('a', { class: 'btn secondary tool-open', href: t.href, target: t.external ? '_blank' : null, rel: t.external ? 'noopener' : null },
          t.external ? 'Ouvrir le groupe' : 'Ouvrir', E.icon('right-from-bracket')));
    }

    E.clear(app).appendChild(h('div', { class: 'tool-grid' }, TOOLS.map(toolCard)));
  })();
  </script>
</body>
</html>
