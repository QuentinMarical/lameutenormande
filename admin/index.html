<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace admin — La Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="stylesheet" href="../elections/assets/elections.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="https://lameutenormande.fr/" title="Retour au site"><img src="https://lameutenormande.fr/assets/images/logo-2000x837.png" alt="La Meute Normande" decoding="async"></a>
      <nav id="nav" aria-label="Admin"></nav>
    </div>
  </header>
  <section class="page-head xmb-hide-desktop">
    <h1>Espace administrateur</h1>
    <div class="sub">Connexion unique pour tous les panels du staff</div>
  </section>
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer xmb-hide-desktop" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../elections/assets/config.js"></script>
  <script src="../elections/assets/common.js"></script>
  <script src="../elections/assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    { const f = E.qs('#footer'); f.innerHTML = '<div class="footer-divider"></div>'
      + '<div class="footer-title">Espace admin de la Meute</div>'
      + '<div class="legal-links"><button type="button" class="legal-btn" data-legal="mentions">Mentions légales</button><span class="legal-sep">·</span><button type="button" class="legal-btn" data-legal="confidentialite">Politique de confidentialité</button><span class="legal-sep">·</span><button type="button" class="legal-btn" data-legal="cookies">Politique de cookies</button></div>'
      + '<p class="legal">Outil réalisé par <a href="tg://resolve?domain=NitraFox" class="link-nitra">Nitra🦊</a> pour <a href="https://lameutenormande.fr" class="link-violet">La Meute Normande</a>.</p>';
      f.addEventListener('click', (e) => { const b = e.target.closest('.legal-btn'); if (b && E.openLegal) E.openLegal(b.dataset.legal); }); }
    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (même compte Supabase Auth que les panels) ----------
    const session = await E.adminSession();
    if (!session) {
      const email = h('input', { class: 'input', type: 'email', autocomplete: 'username', required: true, placeholder: 'admin@exemple.fr' });
      const pass = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
      const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
      const form = h('form', { class: 'card info column', style: { maxWidth: '460px', margin: '0 auto' } },
        h('div', { class: 'title' }, 'Connexion administrateur'),
        h('div', { class: 'field' }, h('label', null, 'E-mail'), email), h('div', { class: 'field' }, h('label', null, 'Mot de passe'), pass),
        h('div', { class: 'btn-row', style: { marginTop: 0 } }, btn));
      form.addEventListener('submit', async ev => {
        ev.preventDefault(); btn.disabled = true;
        const { error } = await E.sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
        if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
        location.reload();
      });
      E.clear(app).appendChild(form);
      return;
    }
    const { data: isAdmin } = await E.sb.rpc('is_admin');
    if (!isAdmin) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    { const slot = E.qs('.topbar .bar'); slot.appendChild(h('div', { class: 'actions' }, h('span', { class: 'account' }, h('span', null, session.user.email || 'admin'), h('button', { type: 'button', onClick: E.signOut, title: 'Se déconnecter' }, '⏻')))); }

    // ---------- Panels disponibles ----------
    // subitems : { title, desc, hash } pour un onglet du panel (href = panel.href + #hash) — ou
    // { title, desc, href } pour un lien direct, ou { title, desc, action } pour une action JS
    // (ouvrir une modale). Le premier panel (« La Meute Normande ») sert de première case, comme
    // l'icône de compte tout à gauche d'un menu XMB ; ses entrées remplacent le pied de page
    // (masqué en desktop) : retour au site, pages légales, crédit.
    const LOGO = 'https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png';
    const PANELS = [
      { key: 'home', label: 'La Meute Normande', desc: 'Retour à l\'accueil du site.', logo: LOGO, href: 'https://lameutenormande.fr/', subitems: [
        { title: 'Retour au site', desc: 'lameutenormande.fr', href: 'https://lameutenormande.fr/' },
        { title: 'Mentions légales', desc: 'Éditeur, hébergement, propriété intellectuelle.', action: () => E.openLegal('mentions') },
        { title: 'Politique de confidentialité', desc: 'RGPD : données collectées, droits des visiteurs.', action: () => E.openLegal('confidentialite') },
        { title: 'Politique de cookies', desc: 'Stockage local utilisé par le site.', action: () => E.openLegal('cookies') },
        { title: 'Crédit', desc: 'À propos de l\'écran d\'accueil de cet espace admin.', action: () => openCredit() }
      ] },
      { key: 'elections', label: 'Élections', desc: 'Scrutins, candidatures, dépouillement et audit.', icon: 'check-to-slot', href: 'elections/', subitems: [
        { hash: 'scrutins', title: 'Scrutins', desc: 'Créer un scrutin, l\'ouvrir ou le clôturer.' },
        { hash: 'codes', title: 'Codes', desc: 'Générer les codes de vote et les distribuer.' },
        { hash: 'candidatures', title: 'Candidatures', desc: 'Voir les candidatures, en retirer si besoin.' },
        { hash: 'votants', title: 'Votants', desc: 'Bulletins soumis ; invalider un bulletin suspect.' },
        { hash: 'audit', title: 'Audit', desc: 'Journal des actions du staff sur ce scrutin.' },
        { hash: 'pv', title: 'Procès-verbal', desc: 'Résultats détaillés, à imprimer ou exporter.' },
        { hash: 'reglages', title: 'Réglages', desc: 'Annonces automatiques sur Telegram.' }
      ] },
      { key: 'votes', label: 'Sondages', desc: 'Sondages ponctuels : présence, covoiturage…', icon: 'chart-simple', href: 'votes/', subitems: [
        { hash: 'sondages', title: 'Sondages', desc: 'Créer un sondage, l\'ouvrir ou le clôturer.' },
        { hash: 'reponses', title: 'Réponses', desc: 'Voir les réponses reçues à ce sondage.' }
      ] },
      { key: 'utilisateurs', label: 'Utilisateurs', desc: 'Comptes administrateurs, communs à tous les panels.', icon: 'gear', href: 'utilisateurs/', subitems: [
        { title: 'Comptes administrateurs', desc: 'Inviter, réinitialiser ou désactiver un accès.' }
      ] }
    ];
    const DEFAULT_COL = 1; // Élections plutôt que le logo, au premier chargement

    function panelIcon(p) {
      return p.logo ? E.h('img', { src: p.logo, alt: '' }) : E.icon(p.icon);
    }
    function itemHref(panel, item) {
      if (item.action) return '#';
      if (item.href) return item.href;
      return panel.href + (item.hash ? '#' + item.hash : '');
    }
    function wireItem(a, item) {
      if (item.action) a.addEventListener('click', (e) => { e.preventDefault(); item.action(); });
    }

    // ---------- Crédit ----------
    // Réutilise le même habillage que les modales légales (déjà chargé via elections.css/legal.js).
    function openCredit() {
      const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      const bg = h('div', { class: 'legal-modal-bg', onClick: (e) => { if (e.target === bg) close(); } },
        h('div', { class: 'legal-modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Crédit' },
          h('div', { class: 'legal-modal-header' }, h('h3', { class: 'legal-modal-title' }, 'Crédit'),
            h('button', { class: 'legal-modal-close', type: 'button', 'aria-label': 'Fermer', onClick: close }, '×')),
          h('div', { class: 'legal-modal-body' },
            h('p', null, 'À partir de 1024px de large, l\'écran d\'accueil de cet espace admin s\'inspire du projet ',
              h('a', { href: 'https://github.com/menonparik/xmb-on-web', target: '_blank', rel: 'noopener' }, 'xmb-on-web'),
              ' — une reconstitution du menu XMB de la PlayStation 3 en HTML/CSS/JS.'),
            h('p', null, 'La disposition (rangée de catégories, liste d\'onglets avec l\'entrée sélectionnée agrandie) et l\'esprit des animations en sont directement inspirés ; le code de cette page reste original et propre à cet outil.'))));
      document.body.appendChild(bg);
      document.addEventListener('keydown', onKey);
      const first = bg.querySelector('.legal-modal-close'); if (first) first.focus();
    }

    E.clear(app);

    // ---------- Version mobile/tablette (< 1024px) : grille de tuiles + liste de sous-catégories ----------
    (function buildMobile() {
      const wrap = h('div', { class: 'xmb-wrap xmb-mobile-only' });
      const desc = h('div', { class: 'xmb-desc' });
      const row = h('div', { class: 'xmb-row' });
      const submenu = h('div', { class: 'xmb-submenu' });
      let col = DEFAULT_COL, sub = -1, subEls = [];

      function renderSubmenu() {
        E.clear(submenu);
        subEls = PANELS[col].subitems.map((item, i) => {
          const a = h('a', { class: 'xmb-sub-item', href: itemHref(PANELS[col], item) }, item.title);
          wireItem(a, item);
          a.addEventListener('mouseenter', () => { sub = i; highlight(); });
          a.addEventListener('focus', () => { sub = i; highlight(); });
          submenu.appendChild(a);
          return a;
        });
        submenu.classList.toggle('open', subEls.length > 0);
      }
      function highlight() {
        tiles.forEach((t, i) => t.classList.toggle('active', i === col));
        desc.textContent = PANELS[col].desc;
        subEls.forEach((a, i) => a.classList.toggle('active', i === sub));
      }
      const tiles = PANELS.map((p, i) => {
        const tile = h('a', { class: 'xmb-tile', href: p.href, tabindex: '0' },
          h('div', { class: 'icon-wrap' }, panelIcon(p)),
          h('div', { class: 'label' }, p.label));
        const onEnter = () => { if (col !== i) { col = i; renderSubmenu(); } sub = -1; highlight(); };
        tile.addEventListener('mouseenter', onEnter);
        tile.addEventListener('focus', onEnter);
        row.appendChild(tile);
        return tile;
      });
      function setCol(newCol, moveFocus) {
        col = (newCol + PANELS.length) % PANELS.length; sub = -1;
        renderSubmenu(); highlight();
        if (moveFocus) tiles[col].focus();
      }
      wrap.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); setCol(col + 1, true); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); setCol(col - 1, true); }
        else if (e.key === 'ArrowDown') {
          if (!subEls.length) return;
          e.preventDefault();
          sub = sub === -1 ? 0 : Math.min(sub + 1, subEls.length - 1);
          highlight(); subEls[sub].focus();
        } else if (e.key === 'ArrowUp') {
          if (sub === -1) return;
          e.preventDefault();
          sub = sub === 0 ? -1 : sub - 1;
          highlight();
          if (sub === -1) tiles[col].focus(); else subEls[sub].focus();
        }
      });
      wrap.append(row, submenu, desc);
      app.appendChild(wrap);
      renderSubmenu(); highlight();
      tiles[col].focus({ preventScroll: true });
    })();

    // ---------- Version desktop (≥ 1024px) : façon écran d'accueil PS3 (voir Crédit) ----------
    // Rangée de catégories en haut (icône + libellé visible seulement sur la case active) ; en
    // dessous, la liste des onglets de la catégorie active dans une fenêtre à hauteur fixe (donc
    // jamais de scrollbar, quel que soit le nombre d'onglets) : l'entrée sélectionnée glisse en
    // haut de cette fenêtre et s'affiche en grand (icône + titre + description qui pulse), les
    // suivantes restent petites en dessous.
    (function buildDesktop() {
      const ROW_H = 46; // hauteur d'une ligne repliée (doit rester synchro avec admin.css)
      const xmb = h('div', { class: 'xmb2 xmb-desktop-only' });
      const catRow = h('div', { class: 'xmb2-row' });
      const viewport = h('div', { class: 'xmb2-list-viewport' });
      const list = h('div', { class: 'xmb2-list' });
      viewport.appendChild(list);
      let col = DEFAULT_COL, subIdx = 0, zone = 'cat', subEls = [];

      const cats = PANELS.map((p, i) => {
        const cat = h('a', { class: 'xmb2-cat', href: p.href, tabindex: '0' },
          h('div', { class: 'xmb2-cat-icon' }, panelIcon(p)),
          h('div', { class: 'xmb2-cat-label' }, p.label));
        const onEnter = () => setCol(i, false);
        cat.addEventListener('mouseenter', onEnter);
        cat.addEventListener('focus', onEnter);
        catRow.appendChild(cat);
        return cat;
      });

      function renderList() {
        E.clear(list);
        subEls = PANELS[col].subitems.map((item, i) => {
          const a = h('a', { class: 'xmb2-item', href: itemHref(PANELS[col], item) },
            h('div', { class: 'xmb2-item-icon' }, panelIcon(PANELS[col])),
            h('div', { class: 'xmb2-item-text' }, h('div', { class: 'xmb2-item-title' }, item.title), h('div', { class: 'xmb2-item-desc' }, item.desc || '')));
          wireItem(a, item);
          a.addEventListener('mouseenter', () => { subIdx = i; zone = 'list'; paint(); });
          a.addEventListener('focus', () => { subIdx = i; zone = 'list'; paint(); });
          list.appendChild(a);
          return a;
        });
        viewport.classList.toggle('open', subEls.length > 0);
      }
      function paint() {
        cats.forEach((c, i) => c.classList.toggle('active', i === col));
        subEls.forEach((a, i) => a.classList.toggle('active', i === subIdx));
        // Fait glisser la liste pour amener l'entrée active en haut de la fenêtre visible : tant
        // que seule une ligne est agrandie à la fois, les lignes qui précèdent mesurent toutes
        // ROW_H, ce décalage place donc toujours l'entrée active exactement au sommet.
        list.style.transform = 'translateY(-' + (subIdx * ROW_H) + 'px)';
      }
      function setCol(newCol, moveFocus) {
        col = (newCol + PANELS.length) % PANELS.length; subIdx = 0; zone = 'cat';
        renderList(); paint();
        if (moveFocus) cats[col].focus();
      }
      xmb.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); setCol(col + 1, true); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); setCol(col - 1, true); }
        else if (e.key === 'ArrowDown') {
          if (!subEls.length) return;
          e.preventDefault();
          if (zone === 'cat') { zone = 'list'; subIdx = 0; }
          else subIdx = Math.min(subIdx + 1, subEls.length - 1);
          paint(); subEls[subIdx].focus();
        } else if (e.key === 'ArrowUp') {
          if (zone !== 'list') return;
          e.preventDefault();
          if (subIdx === 0) { zone = 'cat'; paint(); cats[col].focus(); }
          else { subIdx -= 1; paint(); subEls[subIdx].focus(); }
        }
      });

      xmb.append(catRow, viewport);
      app.appendChild(xmb);
      renderList(); paint();
      cats[col].focus({ preventScroll: true });
    })();
  })();
  </script>
</body>
</html>
