<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace admin — La Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <!-- Installabilité en PWA (voir assets/pwa-install.js) : manifeste + icône iOS, propres à
       l'espace admin (scope /admin/), pas au reste du site public. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://lameutenormande.fr/assets/images/macaron-192x192.png">
  <meta name="theme-color" content="#1e1430">
  <link rel="stylesheet" href="../elections/assets/elections.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <!-- Pas de topbar/page-head statiques : cette page n'a pas de navigation à afficher (c'est déjà
       la racine des outils admin), tout son en-tête est construit dynamiquement ci-dessous, pour
       la connexion comme pour le tableau de bord — voir renderLogin()/renderDashboard(). -->
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../elections/assets/config.js"></script>
  <script src="../elections/assets/common.js"></script>
  <script src="assets/legal.js"></script>
  <script src="assets/pwa-install.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    const LOGO = 'https://lameutenormande.fr/assets/images/logo-2000x837.png';

    // Même pied de page minimal partout (connexion comme tableau de bord une fois dedans) : liens
    // utilitaires + note en petits caractères, plutôt que le module complet (bandeau/titre/crédit)
    // utilisé sur les autres panels admin — cette page n'a pas besoin de se présenter deux fois.
    const footerEl = E.qs('#footer');
    footerEl.innerHTML = '<div class="legal-links">'
      + '<a href="tg://resolve?domain=NitraFox">Aide</a><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="mentions">Mentions légales</button><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="confidentialite">Confidentialité et cookies</button></div>'
      + '<p class="legal">Utilise la navigation privée si ce n\'est pas ton appareil.</p>';
    footerEl.addEventListener('click', (e) => { const b = e.target.closest('.legal-btn'); if (b && E.openLegal) E.openLegal(b.dataset.legal); });

    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (même compte Supabase Auth que les panels) ----------
    // En deux temps (e-mail, puis mot de passe une fois l'adresse reconnue) plutôt qu'un formulaire
    // à deux champs d'un coup — repris de l'enchaînement fourni en référence, avec nos propres
    // textes/identité (aucune marque, logo ou copie de cette référence n'est réutilisée).
    const session = await E.adminSession();
    if (!session) {
      app.classList.add('login-mode');
      let emailVal = '';

      function renderLogin(step) {
        const card = h('div', { class: 'login-card' });

        if (step !== 'password') {
          const email = h('input', { class: 'input login-input', type: 'email', autocomplete: 'username', required: true, placeholder: 'Email', 'aria-label': 'E-mail', value: emailVal || null });
          const btn = h('button', { class: 'btn', type: 'submit' }, 'Suivant');
          const backToSite = h('button', { type: 'button', class: 'btn secondary login-secondary', onClick: () => history.back() }, 'Retour');
          const form = h('form', null,
            h('img', { class: 'login-logo', src: LOGO, alt: '' }),
            h('div', { class: 'login-title' }, 'Se connecter'),
            h('div', { class: 'field' }, email), btn, backToSite);
          form.addEventListener('submit', ev => {
            ev.preventDefault();
            const v = email.value.trim(); if (!v) return;
            emailVal = v; renderLogin('password');
          });
          card.appendChild(form);
          E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
          email.focus();
          return;
        }

        const back = h('button', { type: 'button', class: 'login-back', 'aria-label': 'Changer d\'e-mail', onClick: () => renderLogin('email') }, '←');
        const pass = h('input', { class: 'input login-input', type: 'password', autocomplete: 'current-password', required: true, placeholder: 'Mot de passe', 'aria-label': 'Mot de passe' });
        const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
        const form = h('form', null,
          h('img', { class: 'login-logo', src: LOGO, alt: '' }),
          h('div', { class: 'login-email-pill' }, emailVal),
          h('div', { class: 'login-title' }, 'Entre ton mot de passe'),
          h('div', { class: 'field' }, pass), btn);
        form.addEventListener('submit', async ev => {
          ev.preventDefault(); btn.disabled = true;
          const { error } = await E.sb.auth.signInWithPassword({ email: emailVal, password: pass.value });
          if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
          await E.logAdminLogin();
          location.reload();
        });
        card.append(back, form);
        E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
        pass.focus();
      }
      renderLogin('email');
      return;
    }
    const { data: isAdmin } = await E.sb.rpc('is_admin');
    if (!isAdmin) {
      app.classList.add('login-mode');
      E.clear(app).appendChild(h('div', { class: 'login-shell' }, h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter'))))));
      return;
    }

    // ---------- Outils disponibles ----------
    // links : onglets internes de l'outil (hash sur sa propre page) affichés en accès directs ;
    // omis pour un outil à page unique (Calendrier, Utilisateurs, Logs), qui affiche un simple
    // bouton « Ouvrir » à la place. Un raccourci externe (ex. `external: true`) reste géré par
    // toolCard() ci-dessous si besoin un jour — juste aucun dans TOOLS pour l'instant.
    const TOOLS = [
      {
        key: 'elections', label: 'Élections', icon: 'check-to-slot', accent: 'violet', href: 'elections/',
        desc: 'Scrutins, candidatures, dépouillement et votants.',
        links: [
          { title: 'Scrutins', hash: 'scrutins' }, { title: 'Codes', hash: 'codes' },
          { title: 'Candidatures', hash: 'candidatures' }, { title: 'Votants', hash: 'votants' },
          { title: 'Procès-verbal', hash: 'pv' }, { title: 'Réglages', hash: 'reglages' }
        ]
      },
      {
        key: 'votes', label: 'Sondages', icon: 'chart-simple', accent: 'orange', href: 'votes/',
        desc: 'Sondages ponctuels : présence, covoiturage, préférences…',
        links: [{ title: 'Sondages', hash: 'sondages' }, { title: 'Réponses', hash: 'reponses' }]
      },
      {
        key: 'calendrier', label: 'Calendrier', icon: 'calendar', accent: 'violet', href: 'calendrier/',
        desc: 'Ajoute des évènements au calendrier Zoho qui alimente la page Événements du site.'
      },
      {
        key: 'utilisateurs', label: 'Utilisateurs', icon: 'gear', accent: 'ok', href: 'utilisateurs/',
        desc: 'Comptes administrateurs, communs à tous les panels ci-dessus.'
      },
      {
        key: 'logs', label: 'Logs', icon: 'list', accent: 'ok', href: 'logs/',
        desc: 'Journal de toutes les actions admin (élections, sondages, calendrier, comptes).'
      },
      {
        key: 'mail', label: 'Boîte mail', icon: 'envelope', accent: 'cyan', href: 'https://zimbra1.mail.ovh.net/', external: true,
        desc: 'Webmail Zimbra OVH', email: 'contact@lameutenormande.fr'
      }
    ];

    function toolCard(t) {
      const icon = h('div', { class: 'tool-icon acc-' + t.accent }, E.icon(t.icon));
      const head = h('div', { class: 'tool-head' }, icon,
        h('div', null, h('div', { class: 'tool-title' }, t.label), h('div', { class: 'tool-desc' }, t.desc)));
      if (t.links) {
        return h('div', { class: 'tool-card' }, head,
          h('div', { class: 'tool-links' }, t.links.map(l => h('a', { class: 'tool-pill', href: t.href + '#' + l.hash }, l.title))));
      }
      const openBtn = h('a', { class: 'btn secondary tool-open', href: t.href, target: t.external ? '_blank' : null, rel: t.external ? 'noopener' : null },
        'Ouvrir', E.icon('right-from-bracket'));
      if (!t.email) return h('div', { class: 'tool-card single' }, head, openBtn);
      // L'adresse elle-même est cliquable (copie dans le presse-papiers, pas de mailto: qui
      // ouvrirait un client mail local souvent pas configuré) plutôt qu'un bouton "Copier" séparé —
      // juste une infobulle "Copier" au survol (title natif, même pattern que le reste du site).
      const addrBtn = h('button', { class: 'tool-mail-addr', type: 'button', title: 'Copier', onClick: async () => {
        try { await navigator.clipboard.writeText(t.email); E.toast('Adresse copiée.', 'success'); }
        catch { E.toast('Impossible de copier.', 'error'); }
      } }, t.email);
      return h('div', { class: 'tool-card single' }, head,
        h('div', { class: 'tool-mail-row' }, addrBtn, openBtn));
    }

    // ---------- Tableau de bord ----------
    // En-tête maison (identité + statut de connexion) plutôt qu'une topbar/page-head séparées :
    // cette page n'a pas de navigation à y loger, les deux se réduisaient à afficher un logo et un
    // compte connecté — regroupés ici en un seul bandeau, avec un bouton de déconnexion explicite
    // (texte + icône) plutôt qu'une icône seule seule perdue dans une pastille.
    const dashHeader = h('div', { class: 'dash-header' },
      // Pas de bouton hub ici : on y est déjà (voir admin/elections, admin/votes, admin/utilisateurs
      // pour le bouton qui y mène depuis les autres panels).
      h('div', { class: 'dash-identity' },
        h('a', { class: 'dash-brand', href: 'https://lameutenormande.fr/', title: 'Retour au site' },
          h('img', { class: 'dash-logo', src: LOGO, alt: '' }),
          h('h1', { class: 'dash-title' }, 'Espace admin'))),
      h('div', { class: 'dash-account' },
        h('span', { class: 'dash-email' }, session.user.email || 'admin'),
        h('button', { class: 'btn secondary small', type: 'button', title: 'Se déconnecter', onClick: E.signOut },
          E.icon('right-from-bracket'), h('span', { class: 'btn-label' }, 'Se déconnecter'))));

    E.clear(app).append(dashHeader, h('div', { class: 'tool-grid' }, TOOLS.map(toolCard)));
    if (window.AdminPWA) window.AdminPWA.maybeShowInstallBanner();
  })();
  </script>
</body>
</html>
