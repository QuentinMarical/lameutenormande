<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Logs — Espace admin de la Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://lameutenormande.fr/assets/images/macaron-192x192.png">
  <meta name="theme-color" content="#1e1430">
  <link rel="stylesheet" href="../../elections/assets/elections.css">
  <link rel="stylesheet" href="../assets/admin.css">
</head>
<body>
  <!-- Pas de topbar/page-head statiques : l'en-tête (identité + statut de connexion) est construit
       dynamiquement une fois connecté, même module que sur le hub admin (voir admin/index.html). -->
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../elections/assets/config.js"></script>
  <script src="../../elections/assets/common.js"></script>
  <script src="../assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    // Même pied de page minimal que sur le hub admin (voir admin/index.html) plutôt que le module
    // complet (bandeau/titre/crédit) : liens utilitaires + note en petits caractères.
    { const f = E.qs('#footer'); f.innerHTML = '<div class="legal-links">'
      + '<a href="tg://resolve?domain=NitraFox">Aide</a><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="mentions">Mentions légales</button><span class="legal-sep">·</span>'
      + '<button type="button" class="legal-btn" data-legal="confidentialite">Confidentialité et cookies</button></div>'
      + '<p class="legal">Utilise la navigation privée si ce n\'est pas ton appareil.</p>';
      f.addEventListener('click', (e) => { const b = e.target.closest('.legal-btn'); if (b && E.openLegal) E.openLegal(b.dataset.legal); }); }
    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (même compte que les autres panels) ----------
    const LOGO = 'https://lameutenormande.fr/assets/images/logo-2000x837.png';
    const HUB_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">'
      + '<circle cx="5" cy="5" r="2.1" fill="currentColor"/><circle cx="12" cy="5" r="2.1" fill="currentColor"/><circle cx="19" cy="5" r="2.1" fill="currentColor"/>'
      + '<circle cx="5" cy="12" r="2.1" fill="currentColor"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/><circle cx="19" cy="12" r="2.1" fill="currentColor"/>'
      + '<circle cx="5" cy="19" r="2.1" fill="currentColor"/><circle cx="12" cy="19" r="2.1" fill="currentColor"/><circle cx="19" cy="19" r="2.1" fill="currentColor"/></svg>';
    const session = await E.adminSession();
    if (!session) {
      app.classList.add('login-mode');
      let emailVal = '';

      function renderLogin(step) {
        const card = h('div', { class: 'login-card' });

        if (step !== 'password') {
          const email = h('input', { class: 'input login-input', type: 'email', autocomplete: 'username', required: true, placeholder: 'Email', 'aria-label': 'E-mail', value: emailVal || null });
          const btn = h('button', { class: 'btn', type: 'submit' }, 'Suivant');
          const backToHub = h('button', { type: 'button', class: 'btn secondary login-secondary', onClick: () => history.back() }, 'Retour');
          const form = h('form', null,
            h('img', { class: 'login-logo', src: LOGO, alt: '' }),
            h('div', { class: 'login-title' }, 'Se connecter'),
            h('div', { class: 'field' }, email), btn, backToHub);
          form.addEventListener('submit', ev => {
            ev.preventDefault();
            const v = email.value.trim(); if (!v) return;
            emailVal = v; renderLogin('password');
          });
          card.appendChild(form);
          E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
          email.focus();
          return;
        }

        const back = h('button', { type: 'button', class: 'login-back', 'aria-label': 'Changer d\'e-mail', onClick: () => renderLogin('email') }, '←');
        const pass = h('input', { class: 'input login-input', type: 'password', autocomplete: 'current-password', required: true, placeholder: 'Mot de passe', 'aria-label': 'Mot de passe' });
        const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
        const form = h('form', null,
          h('img', { class: 'login-logo', src: LOGO, alt: '' }),
          h('div', { class: 'login-email-pill' }, emailVal),
          h('div', { class: 'login-title' }, 'Entre ton mot de passe'),
          h('div', { class: 'field' }, pass), btn);
        form.addEventListener('submit', async ev => {
          ev.preventDefault(); btn.disabled = true;
          const { error } = await E.sb.auth.signInWithPassword({ email: emailVal, password: pass.value });
          if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
          await E.logAdminLogin();
          location.reload();
        });
        card.append(back, form);
        E.clear(app).appendChild(h('div', { class: 'login-shell' }, card));
        pass.focus();
      }
      renderLogin('email');
      return;
    }
    const { data: flagRows } = await E.sb.rpc('my_admin_flags');
    const myFlags = flagRows && flagRows[0];
    if (!myFlags) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    if (myFlags.disabled) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Compte désactivé'),
        h('div', { class: 'desc' }, 'Un autre administrateur a désactivé ton accès. Contacte le staff si c\'est une erreur.'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    if (myFlags.must_change_password) {
      const p1 = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', required: true, minlength: 8 });
      const p2 = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', required: true, minlength: 8 });
      const btn = h('button', { class: 'btn', type: 'submit' }, 'Définir le mot de passe');
      const form = h('form', { class: 'card info column', style: { maxWidth: '460px', margin: '3rem auto 0' } },
        h('div', { class: 'title' }, 'Choisis ton mot de passe'),
        h('div', { class: 'desc' }, 'Ton compte utilise encore un mot de passe temporaire. Définis-en un nouveau pour continuer (8 caractères minimum).'),
        h('div', { class: 'field' }, h('label', null, 'Nouveau mot de passe'), p1),
        h('div', { class: 'field' }, h('label', null, 'Confirme le mot de passe'), p2),
        h('div', { class: 'btn-row', style: { marginTop: 0 } }, btn));
      form.addEventListener('submit', async ev => {
        ev.preventDefault();
        if (p1.value.length < 8) { E.toast('8 caractères minimum.', 'error'); return; }
        if (p1.value !== p2.value) { E.toast('Les deux mots de passe ne correspondent pas.', 'error'); return; }
        btn.disabled = true;
        const { error } = await E.sb.auth.updateUser({ password: p1.value });
        if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
        await E.sb.rpc('clear_must_change_password');
        E.toast('Mot de passe défini.', 'success');
        location.reload();
      });
      E.clear(app).appendChild(form);
      return;
    }
    const dashHeader = h('div', { class: 'dash-header' },
      h('div', { class: 'dash-identity' },
        h('a', { class: 'hub-btn', href: 'https://lameutenormande.fr/admin/', title: 'Espace admin', 'aria-label': 'Espace admin', html: HUB_ICON }),
        h('span', { class: 'dash-sep' }),
        h('a', { class: 'dash-brand', href: 'https://lameutenormande.fr/', title: 'Retour au site' },
          h('img', { class: 'dash-logo', src: LOGO, alt: '' }),
          h('h1', { class: 'dash-title' }, 'Logs'))),
      h('div', { class: 'dash-account' },
        h('span', { class: 'dash-email' }, session.user.email || 'admin'),
        h('button', { class: 'btn secondary small', type: 'button', title: 'Se déconnecter', onClick: E.signOut },
          E.icon('right-from-bracket'), h('span', { class: 'btn-label' }, 'Se déconnecter'))));
    E.clear(app).appendChild(dashHeader);
    const pane = h('div'); app.appendChild(pane);

    // ---------- Journal d'actions admin ----------
    // Une seule table (public.audit_log) alimentée par toutes les surfaces admin du site — pas
    // seulement les élections : élections (candidatures, bulletins, codes…), sondages (créer/
    // modifier/supprimer un sondage, supprimer une réponse), calendrier (créer/modifier/supprimer
    // un évènement Zoho) et comptes admin (invitation, reset mot de passe, suppression,
    // activation/désactivation, connexion/déconnexion). Voir public.log_audit()/log_admin_action()
    // dans elections/supabase/schema.sql, et les appels correspondants dans
    // events/sondages/supabase/schema.sql, elections/supabase/functions/zoho-create-event/index.ts
    // et elections/supabase/functions/admin-users/index.ts.
    // Le contenu d'un bulletin (candidat choisi) n'est JAMAIS journalisé : cast_ballot ne log que
    // le nombre de choix (voir schema.sql), jamais quel candidat a été sélectionné.
    const LABEL = {
      ballot_cast: 'Vote', ballot_replaced: 'Vote remplacé', ballot_invalidated: 'Bulletin invalidé', ballot_restored: 'Bulletin restauré',
      candidacy_upsert: 'Candidature', candidacy_withdraw: 'Désistement', candidacy_restored: 'Candidature réactivée',
      election_saved: 'Scrutin modifié', election_deleted: 'Scrutin supprimé', codes_generated: 'Codes générés', code_updated: 'Code modifié', code_deleted: 'Code supprimé',
      admin_login: 'Connexion admin', admin_logout: 'Déconnexion admin', settings_saved: 'Réglages modifiés',
      admin_disabled: 'Administrateur désactivé', admin_enabled: 'Administrateur réactivé',
      admin_invited: 'Administrateur invité', admin_password_reset: 'Mot de passe réinitialisé', admin_deleted: 'Administrateur supprimé',
      poll_created: 'Sondage créé', poll_updated: 'Sondage modifié', poll_questions_saved: 'Questions du sondage modifiées',
      poll_deleted: 'Sondage supprimé', poll_response_deleted: 'Réponse supprimée',
      calendar_event_created: 'Évènement créé', calendar_event_updated: 'Évènement modifié', calendar_event_deleted: 'Évènement supprimé'
    };
    let autoRefresh = false; // pause par défaut : à activer explicitement
    let allRows = [];
    // Connexions/déconnexions masquées par défaut (bruit à haute fréquence, peu utile au
    // quotidien) : décochables comme n'importe quelle autre action via le filtre "Actions".
    const hiddenActions = new Set(['admin_login', 'admin_logout']);
    let selectedAdmin = ''; // '' = tous les admins
    let actionsOpen = false; // préservé entre deux paint() (sinon le <details> se referme à chaque coche)
    let adminOpen = false;

    async function logs() {
      const { data, error } = await E.sb.rpc('audit_log_readable');
      if (error) throw error;
      allRows = data || [];
      paint();
    }

    function paint() {
      E.clear(pane);
      const filtered = allRows.filter(r => !hiddenActions.has(r.action) && (!selectedAdmin || r.actor === selectedAdmin));

      // ---- Filtrage avancé par type d'action ----
      const distinctActions = Array.from(new Set(allRows.map(r => r.action))).sort((a, b) => (LABEL[a] || a).localeCompare(LABEL[b] || b));
      const visibleActionsN = distinctActions.filter(a => !hiddenActions.has(a)).length;
      const actionsDetails = h('details', { class: 'filter-dropdown', open: actionsOpen });
      actionsDetails.addEventListener('toggle', () => {
        actionsOpen = actionsDetails.open;
        if (actionsOpen) { adminDetails.open = false; adminOpen = false; }
      });
      actionsDetails.appendChild(h('summary', null, 'Actions', h('span', { class: 'count' }, visibleActionsN + '/' + distinctActions.length)));
      const actionsMenu = h('div', { class: 'filter-menu' },
        h('div', { class: 'filter-menu-actions' },
          h('button', { class: 'btn secondary small', type: 'button', onClick: () => { hiddenActions.clear(); paint(); } }, 'Tout cocher'),
          h('button', { class: 'btn secondary small', type: 'button', onClick: () => { distinctActions.forEach(a => hiddenActions.add(a)); paint(); } }, 'Tout décocher')),
        ...distinctActions.map(a => {
          const chk = h('input', { type: 'checkbox' });
          chk.checked = !hiddenActions.has(a);
          chk.addEventListener('change', () => { if (chk.checked) hiddenActions.delete(a); else hiddenActions.add(a); paint(); });
          return h('label', { class: 'filter-menu-item' }, chk, LABEL[a] || a);
        }));
      actionsDetails.appendChild(actionsMenu);

      // ---- Filtrage par admin (comptes admin uniquement : on ignore les acteurs "code:...",
      // les codes de vote individuels des élections, sans rapport avec un compte admin) ----
      const adminActors = Array.from(new Map(allRows.filter(r => (r.actor || '').startsWith('admin:')).map(r => [r.actor, r.actor_label || r.actor])).entries())
        .sort((a, b) => a[1].localeCompare(b[1]));
      const selectedAdminLabel = selectedAdmin ? (adminActors.find(([actor]) => actor === selectedAdmin) || [, selectedAdmin])[1] : 'Tous';
      const adminDetails = h('details', { class: 'filter-dropdown', open: adminOpen });
      adminDetails.addEventListener('toggle', () => {
        adminOpen = adminDetails.open;
        if (adminOpen) { actionsDetails.open = false; actionsOpen = false; }
      });
      adminDetails.appendChild(h('summary', null, 'Admin', h('span', { class: 'count' }, selectedAdminLabel)));
      function adminRadio(value, label) {
        const radio = h('input', { type: 'radio', name: 'admin-filter' });
        radio.checked = selectedAdmin === value;
        radio.addEventListener('change', () => { selectedAdmin = value; paint(); });
        return h('label', { class: 'filter-menu-item' }, radio, label);
      }
      adminDetails.appendChild(h('div', { class: 'filter-menu' },
        adminRadio('', 'Tous les admins'),
        ...adminActors.map(([actor, label]) => adminRadio(actor, label))));

      const tbody = h('tbody');
      if (!filtered.length) tbody.appendChild(h('tr', null, h('td', { colspan: '5', class: 'empty' }, 'Aucune entrée pour ces filtres.')));
      filtered.forEach(r => tbody.appendChild(h('tr', null,
        h('td', null, E.fmtDateTime(r.at)),
        h('td', null, r.actor_label || r.actor || '—'),
        h('td', null, h('span', { class: 'badge ' + (/invalid|revok|withdraw|deleted|admin_disabled/.test(r.action) ? 'danger' : /ballot|candid|login|admin_enabled|created/.test(r.action) ? 'ok' : 'muted') }, LABEL[r.action] || r.action)),
        h('td', { class: 'small muted', style: { whiteSpace: 'normal', maxWidth: '320px' } }, (r.target || '') + ' ' + JSON.stringify(r.details)),
        h('td', { class: 'small muted', title: r.user_agent || '', style: { whiteSpace: 'normal', maxWidth: '220px' } }, E.shortUa(r.user_agent)))));
      pane.append(
        h('div', { class: 'btn-row', style: { marginTop: 0, marginBottom: '10px', alignItems: 'center' } },
          h('button', { class: 'btn ' + (autoRefresh ? 'secondary' : '') + ' small', type: 'button', title: autoRefresh ? 'Mettre en pause l\'actualisation auto (toutes les 15 s)' : 'Activer l\'actualisation auto (toutes les 15 s)', onClick: () => { autoRefresh = !autoRefresh; logs(); } }, autoRefresh ? '⏸ Actualisation auto' : '▶ Actualisation auto'),
          h('button', { class: 'btn secondary small', type: 'button', onClick: () => downloadCsv('logs.csv', ['at', 'actor_label', 'action', 'target', 'details', 'user_agent'], filtered.map(r => Object.assign({}, r, { details: JSON.stringify(r.details) }))) }, 'CSV'),
          h('div', { style: { marginLeft: 'auto', display: 'flex', gap: '.6rem', flexWrap: 'wrap' } }, actionsDetails, adminDetails)),
        h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, ...['Date', 'Acteur', 'Action', 'Détails', 'Navigateur'].map(t => h('th', null, t)))), tbody)));
    }
    function downloadCsv(name, cols, rows) {
      // Guillemets doublés + neutralisation des formules (=, +, -, @) pour éviter l'injection CSV dans Excel/LibreOffice
      const escape = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
      const csv = [cols.join(';'), ...rows.map(r => cols.map(c => escape(r[c])).join(';'))].join('\r\n');
      const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })), download: name });
      document.body.appendChild(a); a.click(); a.remove();
    }
    logs();
    setInterval(() => { if (autoRefresh) logs().catch(() => {}); }, 15000);
  })();
  </script>
</body>
</html>
