<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration — Élections de la Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/elections.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="https://lameutenormande.fr/" title="Retour au site"><img src="https://lameutenormande.fr/assets/images/logo-2000x837.png" alt="La Meute Normande" decoding="async"></a>
      <nav id="nav" aria-label="Élections"></nav>
    </div>
  </header>
  <section class="page-head">
    <h1>Administration des élections</h1>
    <div class="sub">Scrutins · codes · candidatures · votants · audit · procès-verbal</div>
  </section>
  <main class="wrap wide" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/roles.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    E.footer();
    await E.renderNav('admin.html');
    if (!E.ready) { E.notConfigured(app); return; }

    // ---------- Connexion admin (e-mail + mot de passe Supabase Auth) ----------
    const session = await E.adminSession();
    if (!session) {
      const email = h('input', { class: 'input', type: 'email', autocomplete: 'username', required: true, placeholder: 'admin@exemple.fr' });
      const pass = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
      const btn = h('button', { class: 'btn', type: 'submit' }, 'Se connecter');
      const form = h('form', { class: 'card info column', style: { maxWidth: '460px', margin: '0 auto' } },
        h('div', { class: 'title' }, 'Connexion administrateur'),
        h('div', { class: 'desc' }, 'Compte créé dans Supabase → Authentication → Users, puis ajouté à la table admins.'),
        h('div', { class: 'field' }, h('label', null, 'E-mail'), email), h('div', { class: 'field' }, h('label', null, 'Mot de passe'), pass),
        h('div', { class: 'btn-row', style: { marginTop: 0 } }, btn));
      form.addEventListener('submit', async ev => {
        ev.preventDefault(); btn.disabled = true;
        const { error } = await E.sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
        if (error) { E.toast(E.errMsg(error), 'error'); btn.disabled = false; return; }
        // Best-effort : un compte authentifié mais pas admin n'a pas le droit d'écrire dans l'audit
        // (admin_log_event vérifie is_admin() lui-même), on ne bloque pas la connexion pour ça.
        try { await E.sb.rpc('admin_log_event', { p_event: 'login' }); } catch {}
        location.reload();
      });
      E.clear(app).appendChild(form);
      return;
    }
    if (!(await E.isAdmin())) {
      E.clear(app).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'icon' }, E.icon('ban')), h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ce compte n\'est pas administrateur'),
        h('div', { class: 'desc' }, 'Dans l\'éditeur SQL Supabase : insert into public.admins (user_id, label) values (\'' + session.user.id + '\', \'' + (session.user.email || '') + '\');'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn secondary small', type: 'button', onClick: E.signOut }, 'Se déconnecter')))));
      return;
    }
    { const slot = E.qs('.topbar .tool.admin'); const chip = h('span', { class: 'account' }, h('span', null, session.user.email || 'admin'), h('button', { type: 'button', onClick: E.signOut, title: 'Se déconnecter' }, E.icon('right-from-bracket'))); if (slot) slot.replaceWith(chip); }

    const rolesMap = await E.loadRoles();
    const allRoles = [...rolesMap.values()];
    E.clear(app);

    // ---------- État ----------
    let elections = [];
    let current = null;
    async function loadElections() {
      const { data } = await E.sb.from('elections').select('*').order('created_at', { ascending: false });
      elections = data || [];
      if (!current || !elections.find(e => e.id === current.id)) current = elections.find(e => e.status === 'open') || elections[0] || null;
      else current = elections.find(e => e.id === current.id);
    }
    await loadElections();

    // ---------- Tabs ----------
    const tabs = [['scrutins', 'Scrutins'], ['codes', 'Codes'], ['candidatures', 'Candidatures'], ['votants', 'Votants'], ['audit', 'Audit'], ['pv', 'Procès-verbal'], ['reglages', 'Réglages']];
    const tabBar = h('div', { class: 'tabs' });
    const pane = h('div');
    const selector = h('select', { class: 'input', style: { width: 'auto', maxWidth: '100%' } });
    function paintSelector() {
      E.clear(selector);
      elections.forEach(e => { const o = h('option', { value: e.id }, e.title + ' (' + E.electionState(e).label + ')'); if (current && e.id === current.id) o.selected = true; selector.appendChild(o); });
    }
    paintSelector();
    selector.addEventListener('change', () => { current = elections.find(e => e.id === selector.value); show(activeTab); });
    app.append(h('div', { class: 'filters' }, h('span', { class: 'small muted' }, 'Scrutin :'), selector), tabBar, pane);
    let activeTab = location.hash.replace('#', '') || 'scrutins';
    tabs.forEach(([id, label]) => tabBar.appendChild(h('button', { type: 'button', dataset: { tab: id }, onClick: () => { activeTab = id; location.hash = id; show(id); } }, label)));
    function show(id) {
      E.qsa('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      E.clear(pane).appendChild(E.loader());
      ({ scrutins, codes, candidatures, votants, audit, pv, reglages })[id]().catch(err => { E.clear(pane).appendChild(h('div', { class: 'card danger' }, h('div', { class: 'body' }, E.errMsg(err)))); });
    }

    const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
    const fromLocalInput = v => v ? new Date(v).toISOString() : null;
    const siteUrl = (E.cfg.SITE_URL || location.href.replace(/[^/]*$/, ''));

    // ---------- Scrutins ----------
    async function scrutins() {
      E.clear(pane);
      const list = h('div', { class: 'cands' });
      elections.forEach(e => list.appendChild(h('div', { class: 'cand selectable' + (current && e.id === current.id ? ' selected' : ''), onClick: () => { current = e; paintSelector(); scrutins(); } },
        h('div', { class: 'body' }, h('div', { class: 'name' }, e.title, E.phaseBadge(e), h('span', { class: 'badge muted' }, e.slug)),
          h('div', { class: 'handles' }, h('span', null, 'Candidatures : ' + (e.candidacy_open ? 'ouvertes' : 'fermées')), h('span', null, 'Votes : ' + (e.voting_open ? 'ouverts' : 'fermés')), h('span', null, e.voting_closes_at ? 'Clôture ' + E.fmtDateTime(e.voting_closes_at) : 'Pas de date de clôture'))))));
      pane.append(h('div', { class: 'btn-row', style: { marginTop: 0, marginBottom: '12px' } }, h('button', { class: 'btn small', type: 'button', onClick: () => editForm(null) }, '＋ Nouveau scrutin')), list);
      if (current) editForm(current);

      function editForm(e) {
        const old = E.qs('#edit-form'); if (old) old.remove();
        const f = {};
        const inp = (name, attrs) => f[name] = h('input', Object.assign({ class: 'input' }, attrs));
        inp('title', { value: e ? e.title : '' }); inp('slug', { value: e ? e.slug : 'staff-' + new Date().getFullYear(), pattern: '[a-z0-9\\-]+' });
        f.description = h('textarea', { class: 'input', style: { minHeight: '70px' } }); f.description.value = e ? e.description : '';
        f.status = h('select', { class: 'input' }); [['draft', 'Brouillon (invisible)'], ['open', 'Ouvert'], ['closed', 'Clôturé'], ['archived', 'Archivé']].forEach(([v, l]) => { const o = h('option', { value: v }, l); if (e && e.status === v) o.selected = true; f.status.appendChild(o); });
        f.candidacy_open = h('input', { type: 'checkbox' }); f.candidacy_open.checked = !!(e && e.candidacy_open);
        f.voting_open = h('input', { type: 'checkbox' }); f.voting_open.checked = !!(e && e.voting_open);
        f.results_public = h('input', { type: 'checkbox' }); f.results_public.checked = e ? e.results_public : true;
        inp('voting_closes_at', { type: 'datetime-local', value: toLocalInput(e && e.voting_closes_at) });
        inp('candidacy_opens_at', { type: 'datetime-local', value: toLocalInput(e && e.candidacy_opens_at) });
        inp('candidacy_closes_at', { type: 'datetime-local', value: toLocalInput(e && e.candidacy_closes_at) });
        inp('voting_opens_at', { type: 'datetime-local', value: toLocalInput(e && e.voting_opens_at) });
        const roleChecks = h('div', { class: 'checks' }); const roleInputs = {};
        allRoles.forEach(r => { const c = h('input', { type: 'checkbox', value: r.id }); c.checked = e ? (e.roles || []).includes(r.id) : true; roleInputs[r.id] = c; roleChecks.appendChild(h('label', { class: 'check' }, c, h('span', null, r.label))); });
        const save = h('button', { class: 'btn', type: 'submit' }, e ? 'Enregistrer' : 'Créer');
        const del = e ? h('button', { class: 'btn danger', type: 'button', onClick: async () => {
          if (!confirm('Supprimer définitivement « ' + e.title + ' » ? Tous ses codes, candidatures et bulletins seront supprimés avec lui. Irréversible.')) return;
          const { error } = await E.sb.rpc('admin_delete_election', { p_election: e.id });
          if (error) { E.toast(E.errMsg(error), 'error'); return; }
          E.toast('Scrutin supprimé.', 'success'); current = null; await loadElections(); paintSelector(); scrutins();
        } }, 'Supprimer ce scrutin') : null;
        const form = h('form', { id: 'edit-form', class: 'card column mt-16' },
          h('div', { class: 'title' }, e ? e.title : 'Nouveau scrutin'),
          h('div', { class: 'grid-2' }, h('div', { class: 'field' }, h('label', null, 'Titre'), f.title), h('div', { class: 'field' }, h('label', null, 'Identifiant (URL)'), f.slug, h('div', { class: 'hint' }, 'minuscules, chiffres, tirets'))),
          h('div', { class: 'field' }, h('label', null, 'Description'), f.description),
          h('div', { class: 'field' }, h('label', null, 'Postes du scrutin'), roleChecks),
          h('div', { class: 'grid-2' }, h('div', { class: 'field' }, h('label', null, 'Statut'), f.status), h('div', { class: 'field' })),
          h('div', { class: 'btn-row', style: { marginTop: 0 } },
            h('label', { class: 'switch' }, f.candidacy_open, 'Candidatures ouvertes'), h('label', { class: 'switch' }, f.voting_open, 'Votes ouverts'), h('label', { class: 'switch' }, f.results_public, 'Scores publics pendant le vote')),
          h('div', { class: 'field' }, h('label', null, 'Programmation automatique (optionnelle)'),
            h('div', { class: 'hint', style: { marginBottom: '8px' } }, 'Heure locale. Laisser vide = contrôle 100% manuel via les boutons ci-dessous. Un rappel Telegram est envoyé 24 h avant chaque échéance ; une ouverture programmée publie aussi le scrutin (brouillon → ouvert) si besoin.'),
            h('div', { class: 'grid-2' },
              h('div', { class: 'field' }, h('label', null, 'Ouverture des candidatures'), f.candidacy_opens_at),
              h('div', { class: 'field' }, h('label', null, 'Fermeture des candidatures'), f.candidacy_closes_at)),
            h('div', { class: 'grid-2' },
              h('div', { class: 'field' }, h('label', null, 'Ouverture des votes'), f.voting_opens_at),
              h('div', { class: 'field' }, h('label', null, 'Clôture des votes'), f.voting_closes_at))),
          h('div', { class: 'btn-row' }, save, e ? h('button', { class: 'btn secondary', type: 'button', onClick: () => quick(e, { candidacy_open: true, voting_open: false, status: 'open' }) }, 'Ouvrir les candidatures') : null,
            e ? h('button', { class: 'btn secondary', type: 'button', onClick: () => quick(e, { candidacy_open: false, voting_open: true, status: 'open' }) }, 'Ouvrir les votes') : null,
            e ? h('button', { class: 'btn danger', type: 'button', onClick: () => confirm('Clôturer le scrutin maintenant ? Les résultats seront annoncés sur Telegram.') && quick(e, { candidacy_open: false, voting_open: false, status: 'closed' }) }, 'Clôturer') : null,
            del));
        form.addEventListener('submit', async ev => {
          ev.preventDefault();
          const payload = { id: e ? e.id : undefined, title: f.title.value.trim(), slug: f.slug.value.trim(), description: f.description.value.trim(), status: f.status.value,
            candidacy_open: f.candidacy_open.checked, voting_open: f.voting_open.checked, results_public: f.results_public.checked,
            candidacy_opens_at: fromLocalInput(f.candidacy_opens_at.value), candidacy_closes_at: fromLocalInput(f.candidacy_closes_at.value),
            voting_opens_at: fromLocalInput(f.voting_opens_at.value), voting_closes_at: fromLocalInput(f.voting_closes_at.value),
            roles: allRoles.filter(r => roleInputs[r.id].checked).map(r => r.id) };
          if (!payload.roles.length) { E.toast('Choisis au moins un poste.', 'error'); return; }
          const { data, error } = await E.sb.rpc('admin_save_election', { p: payload });
          if (error) { E.toast(E.errMsg(error), 'error'); return; }
          E.toast('Scrutin enregistré.', 'success'); await loadElections(); current = elections.find(x => x.id === data.id) || current; paintSelector(); scrutins();
        });
        pane.appendChild(form);
      }
      async function quick(e, patch) {
        const { error } = await E.sb.rpc('admin_save_election', { p: Object.assign({ id: e.id }, patch) });
        if (error) { E.toast(E.errMsg(error), 'error'); return; }
        E.toast('Phase mise à jour.', 'success'); await loadElections(); paintSelector(); scrutins();
      }
    }

    // ---------- Codes ----------
    async function codes() {
      E.clear(pane);
      if (!current) { pane.appendChild(h('div', { class: 'empty' }, 'Aucun scrutin.')); return; }
      const { data, error } = await E.sb.from('voter_codes').select('*').eq('election_id', current.id).order('created_at');
      if (error) throw error;
      const rows = data || [];
      const voteLink = (c) => siteUrl + 'voter.html?e=' + encodeURIComponent(current.slug) + '&code=' + encodeURIComponent(c.code);

      // Génération
      const nInput = h('input', { class: 'input', type: 'number', min: '1', max: '1000', value: '20', style: { width: '90px' } });
      const prefix = h('input', { class: 'input', value: 'MEUTE', maxlength: '10', style: { width: '120px' } });
      const labels = h('textarea', { class: 'input', placeholder: 'Optionnel : un pseudo par ligne (le code n°1 ira au premier, etc.). Si rempli, le nombre de codes = nombre de lignes.', style: { minHeight: '80px' } });
      const gen = h('button', { class: 'btn', type: 'submit' }, 'Générer');
      const genForm = h('form', { class: 'card column' },
        h('div', { class: 'title' }, 'Générer des codes pour « ' + current.title + ' »'),
        h('div', { class: 'desc' }, 'Un code = un membre = un bulletin. Distribue-les en message privé (Telegram / Discord). Chaque code donne aussi accès à la candidature.'),
        h('div', { class: 'filters', style: { marginBottom: 0 } }, h('span', { class: 'small muted' }, 'Nombre'), nInput, h('span', { class: 'small muted' }, 'Préfixe'), prefix, gen),
        h('div', { class: 'field', style: { marginBottom: 0 } }, h('label', null, 'Étiquettes (à qui remettre chaque code)'), labels));
      genForm.addEventListener('submit', async ev => {
        ev.preventDefault();
        const list = labels.value.split('\n').map(s => s.trim()).filter(Boolean);
        const n = list.length || parseInt(nInput.value, 10);
        if (!n || n < 1) { E.toast('Nombre invalide.', 'error'); return; }
        gen.disabled = true;
        const { error } = await E.sb.rpc('admin_generate_codes', { p_election: current.id, p_n: n, p_prefix: prefix.value.trim() || 'MEUTE', p_labels: list.length ? list : null });
        gen.disabled = false;
        if (error) { E.toast(E.errMsg(error), 'error'); return; }
        E.toast(n + ' code(s) généré(s).', 'success'); codes();
      });
      pane.appendChild(genForm);

      // Liste
      const used = rows.filter(r => r.first_used_at).length, revoked = rows.filter(r => r.revoked).length, distributed = rows.filter(r => r.distributed).length;
      const search = h('input', { class: 'input', placeholder: 'Rechercher un code ou une étiquette…' });
      const filter = h('select', { class: 'input', style: { width: 'auto' } }, h('option', { value: '' }, 'Tous'), h('option', { value: 'unused' }, 'Jamais utilisés'), h('option', { value: 'used' }, 'Utilisés'), h('option', { value: 'undistributed' }, 'Non distribués'), h('option', { value: 'revoked' }, 'Révoqués'));
      const csvBtn = h('button', { class: 'btn secondary small', type: 'button', onClick: () => downloadCsv('codes-' + current.slug + '.csv', ['code', 'label', 'lien', 'distributed', 'first_used_at', 'uses', 'revoked'], rows.map(r => Object.assign({}, r, { lien: voteLink(r) }))) }, 'CSV');
      const copyBtn = h('button', { class: 'btn secondary small', type: 'button', onClick: async () => {
        // Même neutralisation de formule que downloadCsv : ce texte peut atterrir dans Excel/Sheets
        // via un collage intelligent (étiquette ou préfixe de code commençant par =, +, -, @).
        const noFormula = v => /^[=+\-@\t\r]/.test(v) ? "'" + v : v;
        const txt = shown().map(r => (r.label ? noFormula(r.label) + ' : ' : '') + noFormula(r.code) + '  →  ' + voteLink(r)).join('\n');
        try { await navigator.clipboard.writeText(txt); E.toast('Liste copiée (' + shown().length + ' lignes).', 'success'); } catch { E.toast('Copie impossible.', 'error'); }
      } }, 'Copier la liste affichée');
      const summary = h('div', { class: 'small muted' }, `${rows.length} codes · ${distributed} distribués · ${used} utilisés · ${revoked} révoqués`);
      const grid = h('div', { class: 'codes-grid' });
      pane.append(h('div', { class: 'filters' }, search, filter, csvBtn, copyBtn, summary), grid);
      function shown() {
        const q = search.value.trim().toLowerCase(), f = filter.value;
        return rows.filter(r => (!q || (r.code + ' ' + (r.label || '')).toLowerCase().includes(q))
          && (f === '' || (f === 'unused' && !r.first_used_at && !r.revoked) || (f === 'used' && r.first_used_at) || (f === 'undistributed' && !r.distributed && !r.revoked) || (f === 'revoked' && r.revoked)));
      }
      function paint() {
        E.clear(grid);
        if (!rows.length) { grid.appendChild(h('div', { class: 'empty', style: { gridColumn: '1/-1' } }, 'Aucun code pour ce scrutin : génère-en ci-dessus.')); return; }
        shown().forEach(r => {
          const lab = h('input', { class: 'input', value: r.label || '', placeholder: 'Étiquette (pseudo)', style: { padding: '6px 8px', fontSize: '12px' } });
          lab.addEventListener('change', async () => { const { error } = await E.sb.rpc('admin_update_code', { p_code_id: r.id, p_label: lab.value }); if (error) E.toast(E.errMsg(error), 'error'); else { r.label = lab.value.trim(); E.toast('Étiquette enregistrée.', 'success'); } });
          const dist = h('input', { type: 'checkbox' }); dist.checked = r.distributed;
          dist.addEventListener('change', async () => { const { error } = await E.sb.rpc('admin_update_code', { p_code_id: r.id, p_distributed: dist.checked }); if (error) E.toast(E.errMsg(error), 'error'); else r.distributed = dist.checked; });
          const card = h('div', { class: 'code-card', style: r.revoked ? { opacity: .5 } : null },
            h('span', { class: 'code-pill', style: r.revoked ? { textDecoration: 'line-through' } : null }, r.code),
            lab,
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '6px', gap: '6px', flexWrap: 'wrap' } },
              h('label', { class: 'switch', style: { fontSize: '11px' } }, dist, 'remis'),
              r.first_used_at ? h('span', { class: 'badge ok' }, 'utilisé ×' + r.uses) : h('span', { class: 'badge muted' }, 'jamais utilisé'),
              r.revoked ? h('span', { class: 'badge danger', title: r.revoked_reason || '' }, 'révoqué') : null),
            h('div', { class: 'btn-row', style: { marginTop: '8px', gap: '6px' } },
              h('button', { class: 'btn secondary small', type: 'button', onClick: async () => { try { await navigator.clipboard.writeText(voteLink(r)); E.toast('Lien copié.', 'success'); } catch { E.toast(voteLink(r)); } } }, 'Lien'),
              r.revoked ? h('button', { class: 'btn ok small', type: 'button', onClick: async () => { const { error } = await E.sb.rpc('admin_update_code', { p_code_id: r.id, p_revoked: false }); if (error) E.toast(E.errMsg(error), 'error'); else codes(); } }, 'Réactiver')
                : h('button', { class: 'btn danger small', type: 'button', onClick: async () => { const reason = prompt('Révoquer ce code ? Son bulletin et ses candidatures seront invalidés. Motif :', 'Code compromis'); if (reason === null) return; const { error } = await E.sb.rpc('admin_update_code', { p_code_id: r.id, p_revoked: true, p_reason: reason }); if (error) E.toast(E.errMsg(error), 'error'); else codes(); } }, 'Révoquer'),
              // Suppression directe possible sans révocation préalable tant que le code n'a jamais servi (aucune trace de vote à motiver).
              (r.revoked || !r.first_used_at) ? h('button', { class: 'btn danger small', type: 'button', onClick: async () => { if (!confirm('Supprimer définitivement ce code (' + r.code + ') ? ' + (r.revoked ? 'Son bulletin et ses candidatures seront supprimés avec lui. ' : '') + 'Irréversible.')) return; const { error } = await E.sb.rpc('admin_delete_code', { p_code_id: r.id }); if (error) E.toast(E.errMsg(error), 'error'); else { E.toast('Code supprimé.', 'success'); codes(); } } }, 'Supprimer') : null));
          grid.appendChild(card);
        });
      }
      search.addEventListener('input', paint); filter.addEventListener('change', paint); paint();
    }

    // ---------- Candidatures ----------
    async function candidatures() {
      E.clear(pane);
      if (!current) { pane.appendChild(h('div', { class: 'empty' }, 'Aucun scrutin.')); return; }
      const { data, error } = await E.sb.from('candidates').select('*, voter_codes(code, label, revoked)').eq('election_id', current.id).order('role').order('created_at');
      if (error) throw error;
      const rows = data || [];
      if (!rows.length) { pane.appendChild(h('div', { class: 'empty' }, 'Aucune candidature.')); return; }
      const tbody = h('tbody');
      rows.forEach(c => {
        const vc = c.voter_codes || {};
        const r = E.roleInfo(c.role);
        const actions = h('td', { class: 'actions' });
        actions.appendChild(h('button', { class: 'btn ' + (c.withdrawn ? 'secondary' : 'danger') + ' small', type: 'button', onClick: async () => {
          if (!c.withdrawn && !confirm('Retirer la candidature de ' + c.display_name + ' (' + r.label + ') ?')) return;
          const { error } = await E.sb.rpc('admin_withdraw_candidacy', { p_candidate: c.id, p_restore: c.withdrawn }); if (error) E.toast(E.errMsg(error), 'error'); else candidatures(); } }, c.withdrawn ? 'Réactiver' : 'Retirer'));
        tbody.appendChild(h('tr', { class: c.withdrawn ? 'invalid' : '' },
          h('td', null, E.avatarEl({ displayName: c.display_name }), c.display_name),
          h('td', null, r.label),
          h('td', null, h('span', { class: 'code-pill' }, vc.code || '?'), vc.label ? ' ' + vc.label : '', vc.revoked ? h('span', { class: 'badge danger', style: { marginLeft: '6px' } }, 'code révoqué') : null),
          h('td', { title: c.bio, style: { maxWidth: '260px', overflow: 'hidden', textOverflow: 'ellipsis' } }, c.bio || '—'),
          h('td', null, E.fmtDateTime(c.updated_at)), actions));
      });
      pane.appendChild(h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, ...['Candidat', 'Poste', 'Code', 'Présentation', 'Mis à jour', ''].map(t => h('th', null, t)))), tbody)));
    }

    // ---------- Votants ----------
    async function votants() {
      E.clear(pane);
      if (!current) { pane.appendChild(h('div', { class: 'empty' }, 'Aucun scrutin.')); return; }
      const { data, error } = await E.sb.from('admin_voters').select('*').eq('election_id', current.id).order('submitted_at', { ascending: false });
      if (error) throw error;
      const rows = data || [];
      const search = h('input', { class: 'input', placeholder: 'Rechercher un code ou une étiquette…' });
      const onlySusp = h('input', { type: 'checkbox' });
      const csv = h('button', { class: 'btn secondary small', type: 'button', onClick: () => downloadCsv('votants-' + current.slug + '.csv', ['code', 'label', 'first_submitted_at', 'submitted_at', 'submissions', 'uses', 'invalidated', 'invalidated_reason', 'suspicion'], rows.map(r => Object.assign({}, r, { suspicion: (r.suspicion || []).join('|') }))) }, 'CSV');
      const summary = h('div', { class: 'small muted' });
      const tbody = h('tbody');
      pane.append(h('div', { class: 'filters' }, search, h('label', { class: 'switch' }, onlySusp, 'Suspects seulement'), csv, summary),
        h('div', { class: 'card info', style: { padding: '10px 14px' } }, h('div', { class: 'desc' }, 'Le contenu des bulletins reste secret : seuls le code, l\'étiquette, l\'horodatage et les drapeaux sont affichés. Invalider un bulletin le retire des résultats sans le supprimer (réversible). Pour exclure définitivement une personne, révoque son code dans l\'onglet Codes.')),
        h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, ...['Code', 'Étiquette', 'Vote', 'Soumissions', 'Drapeaux', 'Choix', ''].map(t => h('th', null, t)))), tbody)));
      const SUSP = { sans_etiquette: ['warn', 'code sans étiquette'], nombreuses_soumissions: ['warn', 'bulletin modifié ≥ 5 fois'], code_tres_utilise: ['danger', 'code saisi ≥ 20 fois'], etiquette_en_double: ['danger', 'étiquette en double'] };
      function paint() {
        E.clear(tbody);
        const q = search.value.trim().toLowerCase();
        const shown = rows.filter(r => (!onlySusp.checked || (r.suspicion || []).length) && (!q || [r.code, r.label].some(v => (v || '').toLowerCase().includes(q))));
        summary.textContent = shown.length + ' / ' + rows.length + ' bulletins · ' + rows.filter(r => !r.invalidated).length + ' valides · ' + rows.filter(r => (r.suspicion || []).length).length + ' suspects';
        shown.forEach(r => {
          const flags = h('td', null, ...(r.suspicion || []).map(s => h('span', { class: 'badge ' + (SUSP[s] || ['muted'])[0], style: { marginRight: '4px' } }, (SUSP[s] || [0, s])[1])));
          const actions = h('td', { class: 'actions' });
          if (!r.invalidated) actions.appendChild(h('button', { class: 'btn danger small', type: 'button', onClick: async () => {
            const reason = prompt('Motif d\'invalidation du bulletin ' + (r.label || r.code) + ' :', (r.suspicion || []).map(s => (SUSP[s] || [0, s])[1]).join(', '));
            if (reason === null) return;
            const { error } = await E.sb.rpc('admin_invalidate_ballot', { p_ballot: r.ballot_id, p_reason: reason }); if (error) E.toast(E.errMsg(error), 'error'); else { E.toast('Bulletin invalidé.', 'success'); votants(); } } }, 'Invalider'));
          else actions.appendChild(h('button', { class: 'btn ok small', type: 'button', title: r.invalidated_reason || '', onClick: async () => {
            const { error } = await E.sb.rpc('admin_restore_ballot', { p_ballot: r.ballot_id }); if (error) E.toast(E.errMsg(error), 'error'); else { E.toast('Bulletin restauré.', 'success'); votants(); } } }, 'Restaurer'));
          tbody.appendChild(h('tr', { class: r.invalidated ? 'invalid' : '' },
            h('td', null, h('span', { class: 'code-pill' }, r.code), r.revoked ? h('span', { class: 'badge danger', style: { marginLeft: '6px' } }, 'révoqué') : null),
            h('td', null, r.label || h('span', { class: 'muted' }, '—')),
            h('td', { title: 'Premier vote : ' + E.fmtDateTime(r.first_submitted_at) }, E.fmtDateTime(r.submitted_at), r.invalidated ? h('div', { class: 'small muted', style: { textDecoration: 'none' } }, 'invalidé : ' + (r.invalidated_reason || '')) : null),
            h('td', null, r.submissions + ' (code saisi ×' + r.uses + ')'),
            flags, h('td', null, String(r.nb_choix)), actions));
        });
      }
      search.addEventListener('input', paint); onlySusp.addEventListener('change', paint); paint();
    }

    // ---------- Audit ----------
    async function audit() {
      E.clear(pane);
      const { data, error } = await E.sb.rpc('audit_log_readable');
      if (error) throw error;
      const rows = data || [];
      // Le contenu d'un bulletin (candidat choisi) n'est JAMAIS journalisé : cast_ballot ne log
      // que le nombre de choix (voir schema.sql), jamais quel candidat a été sélectionné.
      const LABEL = { ballot_cast: 'Vote', ballot_replaced: 'Vote remplacé', ballot_invalidated: 'Bulletin invalidé', ballot_restored: 'Bulletin restauré', candidacy_upsert: 'Candidature', candidacy_withdraw: 'Désistement', candidacy_restored: 'Candidature réactivée', election_saved: 'Scrutin modifié', election_deleted: 'Scrutin supprimé', codes_generated: 'Codes générés', code_updated: 'Code modifié', code_deleted: 'Code supprimé', admin_login: 'Connexion admin', admin_logout: 'Déconnexion admin', settings_saved: 'Réglages modifiés' };
      const tbody = h('tbody');
      rows.forEach(r => tbody.appendChild(h('tr', null,
        h('td', null, E.fmtDateTime(r.at)),
        h('td', null, r.actor_label || r.actor || '—'),
        h('td', null, h('span', { class: 'badge ' + (/invalid|revok|withdraw/.test(r.action) ? 'danger' : /ballot|candid|login/.test(r.action) ? 'ok' : 'muted') }, LABEL[r.action] || r.action)),
        h('td', { class: 'small muted', style: { whiteSpace: 'normal', maxWidth: '320px' } }, (r.target || '') + ' ' + JSON.stringify(r.details)),
        h('td', { class: 'small muted' }, r.ip || '—'),
        h('td', { class: 'small muted', title: r.user_agent || '', style: { whiteSpace: 'normal', maxWidth: '220px' } }, E.shortUa(r.user_agent)))));
      pane.append(h('div', { class: 'btn-row', style: { marginTop: 0, marginBottom: '10px' } }, h('button', { class: 'btn secondary small', type: 'button', onClick: () => downloadCsv('audit.csv', ['at', 'actor_label', 'action', 'target', 'details', 'ip', 'user_agent'], rows.map(r => Object.assign({}, r, { details: JSON.stringify(r.details) }))) }, 'CSV')),
        h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, ...['Date', 'Acteur', 'Action', 'Détails', 'IP', 'Navigateur'].map(t => h('th', null, t)))), tbody)));
    }

    // ---------- Procès-verbal ----------
    async function pv() {
      E.clear(pane);
      if (!current) { pane.appendChild(h('div', { class: 'empty' }, 'Aucun scrutin.')); return; }
      const [{ data: partRows }, { data: voters }, { data: choices }, { data: cands }] = await Promise.all([
        E.sb.rpc('participation', { p_election: current.id }),
        E.sb.from('admin_voters').select('*').eq('election_id', current.id),
        E.sb.from('ballot_choices').select('candidate_id, role, ballots!inner(invalidated, election_id)').eq('ballots.election_id', current.id).eq('ballots.invalidated', false),
        E.sb.from('candidates').select('id, role, display_name, withdrawn').eq('election_id', current.id).eq('withdrawn', false)]);
      const part = partRows && partRows[0] || null;
      const rows = (cands || []).map(c => ({ role: c.role, candidate_id: c.id, display_name: c.display_name, votes: (choices || []).filter(x => x.candidate_id === c.id).length }));
      const roles = E.rolesOf(current);
      const voters_n = (part && part.voters) || 0, codes_n = (part && part.codes_issued) || 0;
      const doc = h('div', { class: 'card column', id: 'pv-doc' });
      doc.append(h('div', { class: 'title', style: { fontSize: '18px' } }, 'Procès-verbal — ' + current.title),
        h('div', { class: 'desc' }, 'La Meute Normande · généré le ' + E.fmtDateTime(new Date()) + ' par ' + (session.user.email || 'admin') + ' · statut : ' + E.electionState(current).label + (current.voting_closes_at ? ' · clôture ' + E.fmtDateTime(current.voting_closes_at) : '')),
        h('div', { class: 'kpis' },
          h('div', { class: 'kpi' }, h('div', { class: 'label' }, 'Bulletins valides'), h('div', { class: 'value' }, String(voters_n))),
          h('div', { class: 'kpi' }, h('div', { class: 'label' }, 'Bulletins invalidés'), h('div', { class: 'value' }, String((part && part.invalidated) || 0))),
          h('div', { class: 'kpi' }, h('div', { class: 'label' }, 'Codes émis'), h('div', { class: 'value' }, String(codes_n))),
          h('div', { class: 'kpi' }, h('div', { class: 'label' }, 'Participation'), h('div', { class: 'value' }, codes_n ? Math.round(voters_n / codes_n * 1000) / 10 + ' %' : '—'), h('div', { class: 'sub' }, 'des codes émis'))));
      roles.forEach(role => {
        const rs = rows.filter(r => r.role === role.id).sort((a, b) => b.votes - a.votes);
        const max = Math.max(1, ...rs.map(r => r.votes));
        const block = h('div', { class: 'chart-wrap' }, h('div', { class: 'role-head' }, h('div', { class: 'icon-circle' }, E.icon(role.icon)), h('div', null, h('div', { class: 'name' }, role.label), h('div', { class: 'desc' }, role.seats + ' poste(s)'))));
        if (!rs.length) block.appendChild(h('div', { class: 'empty' }, 'Aucun candidat.'));
        const list = h('div', { class: 'bar-list' });
        rs.forEach((r, i) => list.appendChild(h('div', { class: 'bar-row' + (i < role.seats && r.votes > 0 ? ' elected' : '') }, h('div', { class: 'who' }, i < role.seats && r.votes > 0 ? E.icon('trophy') : null, ' ' + r.display_name), h('div', { class: 'bar' }, h('i', { style: { width: (r.votes / max * 100) + '%' } })), h('div', { class: 'n' }, r.votes + ' voix'))));
        block.appendChild(list); doc.appendChild(block);
      });
      const invalid = (voters || []).filter(v => v.invalidated);
      if (invalid.length) doc.appendChild(h('div', { class: 'small muted' }, 'Bulletins invalidés : ' + invalid.map(v => (v.label || v.code) + ' (' + (v.invalidated_reason || 'sans motif') + ')').join(' ; ')));
      doc.appendChild(h('div', { class: 'print-only small', style: { marginTop: '24px' } }, 'Signatures du staff : ________________________    ________________________    ________________________'));
      pane.append(h('div', { class: 'btn-row no-print', style: { marginTop: 0, marginBottom: '12px' } },
        h('button', { class: 'btn', type: 'button', onClick: () => window.print() }, 'Imprimer / PDF'),
        h('button', { class: 'btn secondary', type: 'button', onClick: () => downloadCsv('resultats-' + current.slug + '.csv', ['role', 'display_name', 'votes'], rows.map(r => Object.assign({}, r, { role: E.roleInfo(r.role).label }))) }, 'Résultats CSV')), doc);
    }

    // ---------- Réglages ----------
    async function reglages() {
      E.clear(pane);
      const { data } = await E.sb.from('app_settings').select('*');
      const map = Object.fromEntries((data || []).map(r => [r.key, r.value]));
      const url = h('input', { class: 'input', value: map.notify_url || '', placeholder: (E.cfg.SUPABASE_URL || 'https://xxx.supabase.co') + '/functions/v1/telegram-notify' });
      const secret = h('input', { class: 'input', type: 'password', value: map.notify_secret || '', placeholder: 'même valeur que le secret NOTIFY_SECRET de la function' });
      const save = h('button', { class: 'btn', type: 'submit' }, 'Enregistrer');
      const form = h('form', { class: 'card column' }, h('div', { class: 'title' }, 'Annonces Telegram automatiques (optionnel)'),
        h('div', { class: 'desc' }, 'Postgres appelle l\'Edge Function telegram-notify (nouvelle candidature, rappel J-1, résultats). Laisse vide pour désactiver.'),
        h('div', { class: 'field' }, h('label', null, 'URL de la function'), url), h('div', { class: 'field' }, h('label', null, 'Secret partagé'), secret), h('div', { class: 'btn-row' }, save));
      form.addEventListener('submit', async ev => {
        ev.preventDefault();
        const { error } = await E.sb.rpc('admin_save_settings', { p_notify_url: url.value.trim(), p_notify_secret: secret.value.trim() });
        if (error) E.toast(E.errMsg(error), 'error'); else E.toast('Réglages enregistrés.', 'success');
      });
      pane.appendChild(form);
      pane.appendChild(h('div', { class: 'card info' }, h('div', { class: 'body' }, h('div', { class: 'title' }, 'Ajouter un administrateur'), h('div', { class: 'desc' }, 'Crée le compte dans Supabase → Authentication → Users (e-mail + mot de passe), puis dans l\'éditeur SQL : insert into public.admins (user_id, label) select id, \'Prénom\' from auth.users where email = \'adresse@exemple.fr\';'))));
    }

    function downloadCsv(name, cols, rows) {
      // Guillemets doublés + neutralisation des formules (=, +, -, @) pour éviter l'injection CSV dans Excel/LibreOffice
      const escape = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
      const csv = [cols.join(';'), ...rows.map(r => cols.map(c => escape(r[c])).join(';'))].join('\r\n');
      const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })), download: name });
      document.body.appendChild(a); a.click(); a.remove();
    }

    show(tabs.some(t => t[0] === activeTab) ? activeTab : 'scrutins');
    E.subscribe(['ballots', 'candidates', 'elections'], E.debounce(async () => { await loadElections(); paintSelector(); if (['votants', 'candidatures'].includes(activeTab)) show(activeTab); }, 1200));
    // Actualisation périodique de l'onglet Audit (IP/navigateur/acteurs ne passent pas par le broadcast realtime).
    setInterval(() => { if (activeTab === 'audit') audit().catch(() => {}); }, 15000);
  })();
  </script>
</body>
