<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Connexion… — Élections de la Meute Normande</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/elections.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <img class="logo" src="https://lameutenormande.fr/assets/images/logo-2000x837.png" alt="La Meute Normande" width="130" height="54">
      <h1>Connexion en cours</h1>
    </header>
    <div class="content">
      <div class="card info column">
        <div class="loader" id="status">Récupération de la session…</div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/roles.js"></script>
  <script src="../assets/common.js"></script>
  <script src="../assets/auth.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      if (!E.ready) { status.textContent = 'Outil non configuré (assets/config.js).'; return; }
      await A.handleCallback(status);
    })();
  </script>
</body>
</html>
