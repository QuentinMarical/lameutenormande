<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Candidater — Élections de la Meute Normande</title>
  <link rel="shortcut icon" href="https://lameutenormande.fr/assets/images/macaron-128x128-128x128.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/elections.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="https://lameutenormande.fr/" title="Retour au site"><img src="https://lameutenormande.fr/assets/images/logo-2000x837.png" alt="La Meute Normande" decoding="async"></a>
      <nav id="nav" aria-label="Élections"></nav>
    </div>
  </header>
  <section class="page-head">
    <h1>Se porter candidat·e</h1>
    <div class="sub" id="subtitle">Inscription libre, modifiable tant que les candidatures sont ouvertes</div>
  </section>
  <main class="wrap" id="app"><div class="loader">Chargement…</div></main>
  <footer class="site-footer" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/roles.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/legal.js"></script>
  <script>
  (async () => {
    const h = E.h, app = E.qs('#app');
    E.footer();
    await E.renderNav('candidater.html');
    if (!E.ready) { E.notConfigured(app); return; }

    const election = await E.electionFromUrl();
    await E.loadRoles();
    E.clear(app);
    if (!election) { app.appendChild(h('div', { class: 'empty' }, 'Aucun scrutin disponible.')); return; }
    E.qs('#subtitle').textContent = election.title;
    const roles = E.rolesOf(election);
    const q = '?e=' + encodeURIComponent(election.slug);
    const st = E.electionState(election);
    const open = election.candidacy_open && !['closed', 'archived'].includes(election.status);

    if (!open) {
      const notYetStarted = st.phase === 'draft' || st.phase === 'pending';
      app.appendChild(h('div', { class: 'card warn' }, h('div', { class: 'icon' }, E.icon('lock')), h('div', { class: 'body' },
        h('div', { class: 'title' }, notYetStarted ? 'Les candidatures ne sont pas encore ouvertes' : 'Les candidatures sont fermées'),
        h('div', { class: 'desc' }, notYetStarted
          ? 'La phase de candidature de « ' + election.title + ' » n\'a pas encore commencé. Ouverture annoncée sur Telegram.'
          : 'La phase de candidature de « ' + election.title + ' » est terminée. Tu peux consulter les candidats sur la page de vote.'),
        h('div', { class: 'btn-row' }, h('a', { class: 'btn secondary', href: 'voter.html' + q }, 'Page de vote'), h('a', { class: 'btn secondary', href: 'resultats.html' + q }, 'Résultats')))));
      await listAll();
      return;
    }

    const info = await E.requireCode(app, election, { verb: 'candidater' });
    if (!info) return;
    E.codeChip(info);

    const { data: mineData } = await E.sb.rpc('my_candidacies', { p_code: info.code, p_election: election.id });
    const mine = mineData || [];
    const active = mine.filter(c => !c.withdrawn);
    const first = active[0] || mine[0];

    // ---------- Formulaire ----------
    const fName = h('input', { class: 'input', maxlength: '60', required: true, value: (first && first.display_name) || info.label || '' });
    const fBio = h('textarea', { class: 'input', maxlength: '600', placeholder: 'Qui tu es, pourquoi tu te présentes, ce que tu veux apporter à la meute…' });
    fBio.value = (first && first.bio) || '';
    const bioCount = h('div', { class: 'hint' });
    const updCount = () => bioCount.textContent = fBio.value.length + ' / 600';
    fBio.addEventListener('input', updCount); updCount();
    const fTg = h('input', { class: 'input', placeholder: 'pseudo (sans @)', value: (first && first.telegram_username) || '' });
    const fDc = h('input', { class: 'input', placeholder: 'pseudo Discord', value: (first && first.discord_username) || '' });
    const checks = h('div', { class: 'checks' });
    const roleInputs = {};
    roles.forEach(r => {
      const inp = h('input', { type: 'checkbox', value: r.id });
      inp.checked = active.some(c => c.role === r.id);
      roleInputs[r.id] = inp;
      checks.appendChild(h('label', { class: 'check' }, inp, h('span', null, r.label + (r.seats > 1 ? ` (${r.seats} postes)` : ''))));
    });
    const preview = h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } });
    function paintPreview() {
      E.clear(preview);
      preview.appendChild(E.avatarEl({ username: fTg.value.trim(), displayName: fName.value, cls: 'lg' }));
      preview.appendChild(h('div', null, h('div', { style: { fontWeight: 700 } }, fName.value || '—'), h('div', { class: 'small muted' }, 'Aperçu de ta fiche (la photo vient de ton profil Telegram public, si tu en as une)')));
    }
    fName.addEventListener('input', paintPreview); fTg.addEventListener('input', paintPreview); paintPreview();

    const submit = h('button', { class: 'btn', type: 'submit' }, active.length ? 'Mettre à jour mes candidatures' : 'Envoyer ma candidature');
    const form = h('form', null,
      preview, h('div', { class: 'subtle-sep' }),
      h('div', { class: 'field' }, h('label', null, 'Nom affiché'), fName, h('div', { class: 'hint' }, 'Le nom que les votants verront sur le bulletin.')),
      h('div', { class: 'field' }, h('label', null, 'Poste(s) visé(s)'), checks, h('div', { class: 'hint' }, 'Tu peux te présenter à plusieurs postes. Décocher un poste retire cette candidature.')),
      h('div', { class: 'field' }, h('label', null, 'Présentation'), fBio, bioCount),
      h('div', { class: 'grid-2' },
        h('div', { class: 'field' }, h('label', null, 'Pseudo Telegram'), fTg, h('div', { class: 'hint' }, 'Obligatoire pour Modérateur·ice Telegram.')),
        h('div', { class: 'field' }, h('label', null, 'Pseudo Discord'), fDc, h('div', { class: 'hint' }, 'Obligatoire pour Modérateur·ice Discord.'))),
      h('div', { class: 'btn-row' }, submit, h('a', { class: 'btn secondary', href: 'index.html' + q }, 'Retour')));

    const formCard = h('div', { class: 'card column' },
      h('div', { class: 'title' }, (active.length ? 'Modifier ma fiche' : 'Ma candidature') + ' — ' + election.title),
      h('div', { class: 'desc' }, 'Aucune validation préalable : ta candidature apparaît immédiatement sur le bulletin et est annoncée sur Telegram.'),
      form);
    app.appendChild(formCard);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const wanted = roles.filter(r => roleInputs[r.id].checked).map(r => r.id);
      if (!fName.value.trim()) { E.toast('Indique un nom affiché.', 'error'); return; }
      if (!wanted.length && !active.length) { E.toast('Choisis au moins un poste.', 'error'); return; }
      for (const id of wanted) {
        const r = E.roleInfo(id);
        if (r.requires === 'telegram' && !fTg.value.trim()) { E.toast('Pseudo Telegram requis pour ' + r.label + '.', 'error'); return; }
        if (r.requires === 'discord' && !fDc.value.trim()) { E.toast('Pseudo Discord requis pour ' + r.label + '.', 'error'); return; }
      }
      submit.disabled = true; submit.textContent = 'Enregistrement…';
      const errors = [];
      for (const id of wanted) {
        const { error } = await E.sb.rpc('upsert_candidacy', { p_code: info.code, p_election: election.id, p_role: id, p_display_name: fName.value.trim(), p_bio: fBio.value.trim(), p_telegram_username: fTg.value.trim() || null, p_discord_username: fDc.value.trim() || null });
        if (error) errors.push(E.roleInfo(id).label + ' : ' + E.errMsg(error));
      }
      for (const c of active) if (!wanted.includes(c.role)) {
        const { error } = await E.sb.rpc('withdraw_candidacy', { p_code: info.code, p_election: election.id, p_candidate: c.id });
        if (error) errors.push('Retrait ' + E.roleInfo(c.role).label + ' : ' + E.errMsg(error));
      }
      if (errors.length) { E.toast(errors.join(' · '), 'error'); submit.disabled = false; submit.textContent = 'Réessayer'; return; }
      E.toast(wanted.length ? 'Candidature enregistrée !' : 'Candidatures retirées.', 'success');
      setTimeout(() => location.reload(), 900);
    });

    // ---------- Mes candidatures ----------
    app.appendChild(h('h2', { class: 'section-title' }, 'Mes candidatures', h('span', { class: 'count' }, active.length + ' active' + (active.length > 1 ? 's' : ''))));
    if (!mine.length) app.appendChild(h('div', { class: 'empty' }, 'Tu n\'as pas encore de candidature pour ce scrutin.'));
    else {
      const list = h('div', { class: 'cands' });
      mine.forEach(c => {
        const r = E.roleInfo(c.role);
        const card = h('div', { class: 'cand' + (c.withdrawn ? ' disabled' : '') });
        card.appendChild(h('div', { class: 'icon-circle' }, E.icon(r.icon)));
        card.appendChild(h('div', { class: 'body' },
          h('div', { class: 'name' }, r.label, c.withdrawn ? h('span', { class: 'badge muted' }, 'retirée') : h('span', { class: 'badge ok' }, 'en lice')),
          h('div', { class: 'handles' }, 'Mise à jour le ' + E.fmtDateTime(c.updated_at))));
        card.appendChild(c.withdrawn
          ? h('button', { class: 'btn secondary small', type: 'button', onClick: () => { roleInputs[c.role].checked = true; form.requestSubmit(); } }, 'Réactiver')
          : h('button', { class: 'btn danger small', type: 'button', onClick: async () => {
              if (!confirm('Retirer ta candidature au poste « ' + r.label + ' » ?')) return;
              const { error } = await E.sb.rpc('withdraw_candidacy', { p_code: info.code, p_election: election.id, p_candidate: c.id });
              if (error) E.toast(E.errMsg(error), 'error'); else { E.toast('Candidature retirée.', 'success'); setTimeout(() => location.reload(), 700); }
            } }, 'Me désister'));
        list.appendChild(card);
      });
      app.appendChild(list);
    }
    await listAll();

    // ---------- Tous les candidats ----------
    async function listAll() {
      const all = await E.publicCandidates(election.id);
      app.appendChild(h('h2', { class: 'section-title' }, 'Candidat·es déclaré·es', h('span', { class: 'count' }, all.length)));
      if (!all.length) { app.appendChild(h('div', { class: 'empty' }, 'Personne pour l\'instant : lance-toi !')); return; }
      roles.forEach(r => {
        const cs = all.filter(c => c.role === r.id); if (!cs.length) return;
        app.appendChild(h('div', { class: 'role-head', style: { marginTop: '10px' } }, h('div', { class: 'icon-circle' }, E.icon(r.icon)), h('div', null, h('div', { class: 'name' }, r.label), h('div', { class: 'desc' }, cs.length + ' candidat·e' + (cs.length > 1 ? 's' : '')))));
        const list = h('div', { class: 'cands' });
        cs.forEach(c => list.appendChild(h('div', { class: 'cand' }, E.avatarEl({ username: c.telegram_username, displayName: c.display_name }),
          h('div', { class: 'body' }, h('div', { class: 'name' }, c.display_name), c.bio ? h('div', { class: 'bio clamp', text: c.bio }) : null))));
        app.appendChild(list);
      });
    }
  })();
  </script>
</body>
</html>
