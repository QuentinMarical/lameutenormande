  <script>
  (async () => {
    const h = V.h, app = V.qs('#app');
    V.footer();
    if (!V.ready) { V.notConfigured(app); return; }

    const slug = new URLSearchParams(location.search).get('p');
    if (!slug) { V.clear(app).appendChild(h('div', { class: 'empty' }, 'Aucun sondage indiqué.')); return; }

    const { data: poll } = await V.vsb.from('polls').select('*').eq('slug', slug).maybeSingle();
    V.clear(app);
    if (!poll) { app.appendChild(h('div', { class: 'empty' }, 'Sondage introuvable.')); return; }
    V.qs('#pageTitle').textContent = poll.title;
    V.qs('#subtitle').textContent = poll.description || 'Réponds en un clic, sans compte';

    const root = h('div'); app.appendChild(root);
    await V.mountPoll(root, poll);
  })();
  </script>
